name: Widget tests

on:
  pull_request:
    paths:
      - "widgets/**"
      - "sets.json"
      - "tests/**"
      - ".github/workflows/widget-tests.yml"
  push:
    branches: [main]
    paths:
      - "widgets/**"
      - "sets.json"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test widgets/dev
        run: python tests/widget_test.py widgets/dev
