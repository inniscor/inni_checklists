<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="lib/stats.js"></script>
<script src="lib/teams.js"></script>
<script src="lib/nav.js"></script>
<style>
  :root {
    --bg: #E9EDF1;
    --surface: #FFFFFF;
    --ink: #14212E;
    --muted: #5E6B78;
    --line: #D3DAE1;
    --pitch: #0F7A55;
    --pitch-soft: #E2F2EB;
    --slab: #1B2430;
    --focus: #2F6FDB;
    --radius-s: 6px;
    --radius-m: 10px;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }

  /* Tabs (scroll away with the page) */
  .tabbar { padding: 10px 0 6px; }

  /* Toolbar (sticky): the search box, the Filters button with its chips, and the filters panel stay in view while
     everything else scrolls. It spans the .wrap padding so rows don't show at its sides; a shadow appears once it sticks.
     An open filters panel scrolls on its own when it's taller than the room left on screen. */
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -12px; padding: 6px 12px 8px; transition: box-shadow .15s; }
  .toolbar.stuck { box-shadow: 0 8px 12px -10px rgba(20, 33, 46, .35); }
  .summary button, .summary a, #list .card, #list button, .foot button { scroll-margin-top: var(--stick-h, 0px); }
  .toolbar .fpanel { max-height: calc(100vh - 130px); overflow-y: auto; overscroll-behavior: contain; }

  /* Back to top: a footer at the end of the list, and a floating button once the page has scrolled a screen or so. */
  .foot { display: flex; justify-content: center; padding: 20px 0 4px; }
  .fab { position: fixed; right: 16px; bottom: 16px; z-index: 8; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 9px 14px 9px 12px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 6px 18px rgba(20, 33, 46, .25); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .15s, transform .15s, visibility .15s; }
  .fab.show { opacity: 1; visibility: visible; transform: none; }
  .fab .ico, .foot .ico { width: 15px; height: 15px; }
  @media (max-width: 600px) { .fab { padding: 11px; } .fab span { display: none; } }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 4px; }
  .tab { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: var(--radius-s); font-family: var(--cond); font-weight: 600; font-size: 17px; letter-spacing: .01em; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tab .n { font-weight: 500; opacity: .75; margin-left: 4px; }

  /* Search + filter pills */
  #q { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); font-size: 16px; }
  .fgroup { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: start; margin-top: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .fgroup .flabel { font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); padding-top: 4px; }
  .fpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 2px 12px 12px; margin-top: 8px; }
  .fbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
  .fbtn[aria-expanded="true"] { border-color: var(--ink); }
  .fbtn b { font-weight: 600; }
  .fbtn .chev { font-size: 10px; color: var(--muted); transition: transform .15s; }
  .fbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .toggle { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 14px; cursor: pointer; }
  .chip span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 12px; }
  .link { border: 0; background: none; color: var(--focus); padding: 4px 2px; cursor: pointer; font-size: 14px; }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 14px 2px 6px; color: var(--muted); font-size: 14px; }
  .summary { flex-wrap: wrap; }
  .summary .left { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  #download { margin-left: auto; }
  @media (max-width: 600px) { .summary .left { flex-basis: 100%; } #download { margin-left: 0; } #viewbar .seglabel { display: none; } #viewbar { margin-left: auto; } }
  #viewbar { margin-left: 4px; }
  .btn { border: 1px solid var(--ink); background: var(--surface); border-radius: var(--radius-s); padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--ink); color: #fff; }

  /* Search with player suggestions dropdown */
  .search { position: relative; }
  .suggest { position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); box-shadow: 0 6px 18px rgba(20, 33, 46, .12); }
  .suggest .shead { padding: 4px 8px 2px; font-size: 12px; color: var(--muted); }
  .suggest li[role="option"] { padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 15px; }
  .suggest li[role="option"] small { color: var(--muted); margin-left: 6px; }
  .suggest li[aria-selected="true"], .suggest li[role="option"]:hover { background: var(--bg); }

  /* Groups */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); margin-top: 10px; overflow: hidden; }
  .gname { font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1.1; }
  .gmeta { color: var(--muted); font-size: 14px; text-align: right; }
  .bar { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--pitch); }

  /* Card rows */
  .card { border-top: 1px solid var(--line); }
  /* Card rows and 1/1 slot rows share one grid: number (centered in the team tile), name + detail, pill.
     The number column spans the tile (left 6px, width --blkw - 10px) so the number sits in its middle. */
  .card > button, .card > .slotrow { width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; display: grid; grid-template-columns: 61px 1fr auto; gap: 15px; align-items: center; }
  .card > button { cursor: pointer; }
  .card > button .num, .card > .slotrow .num { justify-self: center; }
  .who strong .chev { display: inline-grid; vertical-align: -1px; margin-left: 6px; transition: transform .15s; }
  .card > button[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .num { font-family: var(--cond); font-weight: 600; font-size: 18px; color: var(--muted); }
  .who strong { display: block; font-weight: 600; }
  .who small { color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 4px; }
  .card > button .tags, .card > .slotrow .acts { align-self: start; padding-top: 2px; }
  @media (max-width: 600px) { .tags .badge { white-space: normal; max-width: 30vw; text-align: right; line-height: 1.2; padding: 2px 7px; } .card > button, .card > .slotrow { grid-template-columns: 54px 1fr auto; gap: 14px; } }
  .badge { font-family: var(--cond); font-weight: 600; font-size: 13px; padding: 1px 7px; border-radius: 4px; background: var(--slab); color: #fff; white-space: nowrap; }
  .badge.pcount { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; padding: 3px 9px 3px 10px; }
  .pglyph { width: 17px; height: 17px; display: block; }
  .badge.var { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pars { padding: 2px 12px 12px 88px; display: flex; flex-wrap: wrap; gap: 5px; }
  .par { font-size: 13px; padding: 2px 8px; border-radius: 4px; background: var(--bg); }
  .par.exc { background: transparent; border: 1px solid var(--ink); }
  .par.na { text-decoration: line-through; color: var(--muted); }
  /* 1/1 chips and the 1/1s tab's status pill share three looks: live = dark with a rainbow ring,
     pulled = green with a check, off market = deep green with a lock. */
  .par.one { position: relative; background: var(--slab); color: #fff; border: 0; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .par.one::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: conic-gradient(from 210deg, #7FE3D4, #B4A2F5, #F5B3C8, #F3E39A, #7FE3D4); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .par.one:hover { outline: 2px solid var(--focus); outline-offset: 1px; }
  .par.one.pulled { background: var(--pitch); }
  .par.one.off { background: #0B5A3F; }
  .par.one.pulled::before, .par.one.off::before { display: none; }
  .par.one svg { width: 12px; height: 12px; display: block; }
  .par.one:disabled { cursor: default; } .par.one:disabled:hover { outline: 0; }
  .par.status { font-size: 15px; font-weight: 600; padding: 4px 12px; gap: 5px; white-space: nowrap; }
  .par.one.status .ico { width: 13px; height: 13px; }
  .par.status .car { display: inline-grid; margin-left: 1px; opacity: .8; } .par.status .car .ico { width: 11px; height: 11px; }
  @keyframes flash { from { background: var(--pitch-soft); } to { background: transparent; } }
  .card.slot.flash { animation: flash 2.4s ease-out; }

  /* Popup menus and the header (view and set menus) are styled by lib/nav.js; these are the status menu's marks. */
  .ldot { width: 12px; height: 12px; border-radius: 50%; background: var(--slab); box-shadow: 0 0 0 2px #B4A2F5, 0 0 0 3.5px #F5B3C8; display: block; }
  .gdot { width: 12px; height: 12px; border-radius: 50%; background: var(--pitch); display: block; }

  /* Team tile: a rounded, inset tile in the team's tint behind the card number.
     --blkw is where that area ends; the tile sits 6px inside it. */
  .card { --blkw: 83px; position: relative; }
  .card > button, .card > .pars, .card > .slotrow { position: relative; z-index: 1; }
  .card[style*="--blk"]::before { content: ""; position: absolute; z-index: 0; left: 6px; top: 6px; bottom: 6px; width: calc(var(--blkw) - 10px); border-radius: 8px; background: var(--blk); }
  @media (max-width: 600px) { .card { --blkw: 76px; } }

  /* Group by switch */
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seglabel { font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); margin-right: 6px; }

  /* Group header as a button */
  .ghead { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 8px; align-items: center; }
  .ghead .chev { font-size: 11px; color: var(--muted); transition: transform .15s; }
  .ghead[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .ghead .bar { grid-column: 2 / -1; }
  /* Stats (Checklist tab): a chart button at the right end of each team and player group header flips that group's card over to show
     the shared stats panel (lib/stats.js) where its cards were. While a card is flipped the rest of the list is dimmed
     and inert, and the flipped group can't be collapsed; the chart button, Back to cards, Escape or a click on the
     dimmed list flips it back. The header's tint runs under the button too. */
  .ghwrap { display: flex; align-items: stretch; }
  .ghwrap .ghead { flex: 1; min-width: 0; }
  .gstats { flex: none; width: 46px; border: 0; border-left: 1px solid rgba(20, 33, 46, .1); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .gstats .ico { width: 18px; height: 18px; }
  .gstats:hover { color: var(--ink); background: rgba(255, 255, 255, .45); }
  .gstats[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, .6); }
  #list .group { transition: opacity .2s, filter .2s, box-shadow .2s; scroll-margin-top: var(--stick-h, 0px); }
  #list.focus { cursor: pointer; }
  #list.focus .group:not(.flipped) { opacity: .35; filter: saturate(.5); pointer-events: none; }
  #list.focus .group.flipped { cursor: auto; box-shadow: 0 10px 28px rgba(20, 33, 46, .16); }
  .ghead:disabled { cursor: default; color: inherit; } .ghead:disabled .chev { visibility: hidden; }
  @keyframes flipOut { to { transform: perspective(1400px) rotateY(90deg); } }
  @keyframes flipIn { from { transform: perspective(1400px) rotateY(-90deg); } }
  .group.flip-out { animation: flipOut .17s ease-in forwards; }
  .group.flip-in { animation: flipIn .22s ease-out; }

  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--radius-s); font-size: 14px; max-width: 92vw; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { *, .chev { transition: none !important; } }

  /* Icons, tags and controls: one icon set (.ico), 6px tags, pill-shaped controls. */
  .ico { width: 12px; height: 12px; display: block; flex: none; }
  .chev { display: inline-grid; place-items: center; color: var(--muted); }
  .chev .ico { width: 12px; height: 12px; }
  .group { border-radius: 12px; }
  .badge, .par { border-radius: 6px; }
  .par { padding: 3px 9px; }
  .par b { font-weight: 600; }
  .par.one .ico { width: 11px; height: 11px; }
  .num { font-family: var(--body); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .num i { font-style: normal; opacity: .5; margin-right: 1px; }
  .chip span { background: none; width: 14px; height: 14px; }
  .chip span .ico { width: 12px; height: 12px; }
  .fbtn { gap: 7px; } .fbtn > .ico { width: 15px; height: 15px; }
  #activebar #clear { margin-left: 2px; }
  .btn.ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 500; font-size: 14px; }
  .btn.ghost .ico { width: 15px; height: 15px; }
  .btn.ghost:hover { background: var(--surface); color: var(--ink); border-color: var(--ink); }

  /* Customize (lib/teams.js styles the button and its drawer): the button sits in the corner opposite the set title. */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .topbar .sethead { min-width: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5E7E"/><stop offset=".25" stop-color="#FFB547"/><stop offset=".5" stop-color="#5EE6A8"/><stop offset=".75" stop-color="#5AB8FF"/><stop offset="1" stop-color="#B07CFF"/></linearGradient></defs></svg>
<div class="wrap">
  <div class="topbar">
  <header class="sethead" id="sethead" hidden></header>
  <button class="custbtn" id="custbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="ctdrawer"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7m3 0h1M2.5 11.5h2m3 0h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="lab">Customize</span><span class="cdot" hidden></span></button>
  </div>
  <div class="tabbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="checklist">Checklist<span class="n" id="n-checklist"></span></button>
      <button class="tab" role="tab" data-tab="ones">1/1s<span class="n" id="n-ones"></span></button>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
  <div class="search">
    <input type="search" id="q" placeholder="Search players or teams" aria-label="Search players or teams" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" autocomplete="off">
    <ul class="suggest" id="suggest" role="listbox" aria-label="Pin a player" hidden></ul>
  </div>
  <div class="row" id="activebar">
    <button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="filters"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7m3 0h1M2.5 11.5h2m3 0h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Filters<b id="fcount"></b><span class="chev" aria-hidden="true"><svg class="ico" viewBox="0 0 12 12"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    <span class="row" id="chips" style="margin:0"></span><button class="link" id="clear" hidden>Clear all</button>
  </div>
  <div class="fpanel" id="filters" hidden></div>
  </div>
  <div class="summary">
    <span class="left"><span id="count"></span><button class="link" id="allgroups"></button></span>
    <button class="btn ghost" id="download"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5m0 0L5 7m3 3 3-3M3 12.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>CSV</button>
    <span id="viewbar"></span>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer class="foot" id="foot" hidden><button class="btn ghost totop" id="totop"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V4m0 0L4.5 7.5M8 4l3.5 3.5M3 2.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to top</button></footer>
</div>
<button class="fab totop" id="fab" aria-label="Back to top"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V4m0 0L4.5 7.5M8 4l3.5 3.5M3 2.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Top</span></button>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const TYPES = ['Base', 'Insert', 'SSP', 'Autograph', 'Memorabilia'];
  // How a type reads on screen and in downloads; SSP subsets are the set's case hits.
  const typeLabel = (t) => ({ SSP: 'Case Hit/SSP' })[t] || t;
  const GROUPINGS = [['subset', 'Subset'], ['team', 'Team'], ['player', 'Player']];
  const ICON = {
    chev: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.6 3.6l4.8 4.8m0-4.8-4.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    check: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6.3 4.9 8.7 9.7 3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="5.2" width="7.6" height="5.4" rx="1.2" fill="currentColor"/><path d="M3.9 5.2V3.9a2.1 2.1 0 0 1 4.2 0v1.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
    caret: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.6 6 7.6l3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cl:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cl:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- data source ----------
  const demo = window.DEMO_DATA || null;
  const inGrist = !demo && window.grist && window.self !== window.top;
  const source = {
    async fetch(t) { return demo ? demo[t] : grist.docApi.fetchTable(t); },
    async act(actions) { if (demo) { applyDemo(actions); return; } return grist.docApi.applyUserActions(actions); },
  };
  let demoNextId = 100000;
  function applyDemo(actions) {
    const P = demo.Pulls;

      if (a[0] === 'RemoveRecord') { const i = P.id.indexOf(a[2]); if (i >= 0) for (const k in P) P[k].splice(i, 1); }

  const refs = (v) => Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (typeof v === 'string' && v.startsWith('[') ? JSON.parse(v) : []);

  const D = {};

    players: new Set(),
    panelOpen: false,                               // filters panel
    sug: [], sugIdx: -1,                            // player suggestions under the search box
    groupBy: store.get('groupBy', { checklist: 'team', ones: 'team' }),
    taps: { checklist: new Map(), ones: new Map() }, // groups the visitor opened/closed, per view

  async function loadAll() {
    const [sub, prod, cards, pars, exc, pulls, plyr] = await Promise.all(
      ['Subsets', 'Products', 'Cards', 'Parallels', 'PrintRunExceptions', 'Pulls', 'Players'].map((t) => source.fetch(t)));
    // Teams is optional: a doc without it (or a team without a Tint) just shows no team shading.
    D.baseTint = new Map();
    try { for (const t of rows(await source.fetch('Teams'))) if (t.Team && t.Tint) D.baseTint.set(String(t.Team).trim(), String(t.Tint).trim()); } catch (e) {}

    const playerName = new Map(rows(plyr).map((p) => [p.id, String(p.Player_Name ?? '').trim()]));
    D.subsets = rows(sub); D.products = rows(prod); D.cards = rows(cards); D.parallels = rows(pars); D.exc = rows(exc);
    D.subsetById = new Map(D.subsets.map((s) => [s.id, s]));
    D.parById = new Map(D.parallels.map((p) => { p.products = new Set(refs(p.ParallelProducts_Product)); return [p.id, p]; }));

    for (const p of D.parallels) { if (!D.parsBySubset.has(p.Subset)) D.parsBySubset.set(p.Subset, []); D.parsBySubset.get(p.Subset).push(p); }
    D.excByKey = new Map(D.exc.map((e) => [e.Card_Key + ':' + e.Parallel_Key, e]));
    D.subsetProducts = new Map();
    for (const [sid, ps] of D.parsBySubset) { const set = new Set(); ps.forEach((p) => p.products.forEach((x) => set.add(x))); D.subsetProducts.set(sid, set); }
    for (const c of D.cards) {
      c.sub = D.subsetById.get(c.Subset) || { Subset: '' };
      c.ones = refs(c.One_of_Ones).map((pid) => D.parById.get(pid)).filter(Boolean);
      c.excs = refs(c.Print_Run_Exceptions);
      // Card_Name is the display name; if it's blank, fall back to the card's player names.
      c.playerNames = refs(c.Players).map((id) => playerName.get(id)).filter(Boolean);
      c.name = (typeof c.Card_Name === 'string' && c.Card_Name.trim()) || c.playerNames.join(' / ') || '(No player)';
      // A card can list several teams ("A / B"); each one is a team in its own right for grouping and filters.
      // baseTeam(s) is what the doc says; c.Team and c.teams are what the views use, after custom teams (see below).
      c.baseTeam = String(c.Team || '');

    }

    D.totalOnes = D.cards.reduce((n, c) => n + c.ones.length, 0);
    D.players = [...new Set(D.cards.flatMap((c) => c.playerNames))].sort();
    D.baseTeamNames = new Set(D.cards.flatMap((c) => c.baseTeams));
    // A player's own team, from her single-team cards; used to place each player on a shared card.
    D.basePlayerTeam = new Map();
    for (const c of D.cards) for (const n of c.playerNames) if (!D.basePlayerTeam.has(n) && c.baseTeams.length === 1) D.basePlayerTeam.set(n, c.baseTeams[0]);

  // Off_Market and Reported_At were added to Pulls later; docs without them just don't offer Off market or dates.
  function setPulls(pulls) {
    D.hasOffMarket = 'Off_Market' in pulls;
    D.hasReported = 'Reported_At' in pulls;
    D.pulls = new Map(); for (const p of rows(pulls)) D.pulls.set(p.Card_Key + ':' + p.Parallel_Key, p);
    D.statsVersion = (D.statsVersion || 0) + 1;
  }
  async function reloadPulls() { setPulls(await source.fetch('Pulls')); render(); }
  const pullOf = (c, p) => D.pulls.get(c.id + ':' + p.id);

  // ---------- custom teams ----------
  // My teams (lib/teams.js) rewrites each card's c.Team / c.teams from the doc's c.baseTeam / c.baseTeams; every view
  // reads those, so grouping, filters, shading, search, stats and CSV all follow. See lib/teams.js for the rules.
  function applyCustomTeams() {
    D.statsVersion = (D.statsVersion || 0) + 1;
    Object.assign(D, window.MyTeams ? MyTeams.apply({ cards: D.cards, basePlayerTeam: D.basePlayerTeam, baseTint: D.baseTint, players: D.players })
      : (() => { D.cards.forEach((c) => { c.teams = c.baseTeams; c.Team = c.baseTeam; }); return { teamTint: D.baseTint, customNames: new Set(), playerTeam: D.basePlayerTeam }; })());
    for (const c of D.cards) c.search = (c.name + ' ' + c.playerNames.join(' ') + ' ' + c.Team).toLowerCase();
    D.teams = [...new Set(D.cards.flatMap((c) => c.teams))].sort((a, b) => (D.customNames.has(b) - D.customNames.has(a)) || a.localeCompare(b));
    // A team filter on a team that no longer has cards (renamed, emptied, turned off) would hide everything.
    for (const t of [...S.f.team]) if (!D.teams.includes(t)) S.f.team.delete(t);
  }
  function mountCustomTeams() {
    if (!window.MyTeams) return;
    MyTeams.mount({
      players: () => D.players,
      baseTeamNames: () => D.baseTeamNames,
      teamCards: (name) => D.cards.reduce((n, c) => n + (c.teams.includes(name) ? 1 : 0), 0),
      toast,
      changed: () => { applyCustomTeams(); render(); },
      // Keep open groups and a team filter on a renamed custom team.
      renamed: (from, to) => {
        for (const g of Object.values(S.taps)) if (g.has('t' + from)) { g.set('t' + to, g.get('t' + from)); g.delete('t' + from); }
        if (S.f.team.delete(from)) S.f.team.add(to);
        if (S.flip === 't' + from) S.flip = 't' + to;
      },
    });
  }

  // ---------- filtering ----------
  function cardMatches(c) {
    const f = S.f;
    if (f.team.size && !c.teams.some((t) => f.team.has(t))) return false;
    if (f.subset.size && !f.subset.has(String(c.Subset))) return false;
    if (f.type.size && ![...f.type].some((t) => c.sub[t])) return false;
    if (f.product.size) { const sp = D.subsetProducts.get(c.Subset); if (!sp || ![...f.product].some((p) => sp.has(+p))) return false; }
    if (S.q && !c.search.includes(S.q)) return false;
    if (S.players.size && !c.playerNames.some((n) => S.players.has(n))) return false;
    return true;
  }
  const parInProduct = (p) => !S.f.product.size || [...S.f.product].some((x) => p.products.has(+x));
  // A 1/1 is live (no pull logged), pulled, or off market (pulled, and the owner says it isn't for sale).
  const slotState = (c, p) => { const pl = pullOf(c, p); return !pl ? 'live' : pl.Off_Market ? 'off' : 'pulled'; };
  const STATES = { live: ['Live', 'Still out there'], pulled: ['Pulled', 'Someone has it'], off: ['Off market', 'Pulled, and not for sale'] };
  const stateKeys = () => D.hasOffMarket ? ['live', 'pulled', 'off'] : ['live', 'pulled'];
  const statusOk = (c, p) => !S.f.status.size || S.f.status.has(slotState(c, p));
  // 1/1s of a card that pass product + status filters
  const visibleOnes = (c) => c.ones.filter((p) => parInProduct(p) && statusOk(c, p));
  const productOnes = (c) => c.ones.filter(parInProduct);

  function cardParallels(c) {
    return (D.parsBySubset.get(c.Subset) || []).filter(parInProduct).map((p) => {
      const e = D.excByKey.get(c.id + ':' + p.id);
      if (e) return { p, label: e.Label || p.Parallel, run: e.Not_Available ? null : e.Print_Run, na: !!e.Not_Available, exc: true };
      return { p, label: p.Parallel + (p.Print_Run ? ' /' + p.Print_Run : ''), run: p.Print_Run, na: false, exc: false };

  }

  // ---------- grouping ----------
  // Each card yields [key, name] pairs; a card showing several players lands in each player's group.
  const groupsOf = {
    subset: (c) => [['s' + c.Subset, c.sub.Subset]],
    team: (c) => (c.teams.length ? c.teams : ['(No team)']).map((t) => ['t' + t, t]),
    player: (c) => (c.playerNames.length ? c.playerNames : ['(No player)']).map((n) => ['p' + n, n]),
  };
  const groupSort = { subset: (a, b) => a.first.Subset - b.first.Subset, team: (a, b) => (D.customNames.has(b.name) - D.customNames.has(a.name)) || a.name.localeCompare(b.name), player: (a, b) => a.name.localeCompare(b.name) };
  function groupCards(cards) {
    const by = S.groupBy[S.tab];

    const gs = [...m.values()].sort(groupSort[by]);
    for (const g of gs) g.cards.sort((a, b) => (a.Subset - b.Subset) || (a.Card_Number - b.Card_Number));
    return gs;
  }
  // Groups start closed and open or close only when the visitor clicks them (or Expand/Collapse all).

  const taps = () => S.taps[S.tab];
  const isOpen = (g) => taps().get(g.key) === true;

  // ---------- controls ----------
  function filterGroups() {
    const g = [
      ['team', 'Team', D.teams.map((t) => [t, t])],
      ['type', 'Type', TYPES.map((t) => [t, typeLabel(t)])],
      ['subset', 'Subset', D.subsets.map((s) => [String(s.id), s.Subset])],
      ['product', 'Product', D.products.map((p) => [String(p.id), p.Product])],

  // Filters live in a panel behind the Filters button. Everything narrowing the list (filter pills and

  const chip = (attrs, label) => `<button class="chip" ${attrs} aria-label="Remove ${esc(label)}">${esc(label)}<span aria-hidden="true">${ICON.x}</span></button>`;
  function renderViewbar() {

  function bind() {

    };

      const open = $('#allgroups').dataset.action === 'expand';
      for (const k of S.groupKeys || []) taps().set(k, open);

    };

    $('#list').addEventListener('click', onListClick);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.flip && !(window.MyTeams && MyTeams.isOpen()) && !Nav.menuOpen()) { e.preventDefault(); flipStats(null); } });
    document.querySelectorAll('.totop').forEach((b) => b.onclick = backToTop);
    let ticking = false;
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; updateScrollUi(); }); } };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);

    if (window.ResizeObserver) new ResizeObserver(() => { document.documentElement.style.setProperty('--stick-h', $('#toolbar').offsetHeight + 8 + 'px'); }).observe($('#toolbar'));
  }

  // ---------- sticky toolbar and back to top ----------
  // The toolbar gets a shadow once it's stuck. The footer shows when the page is taller than the screen; the floating
  // button shows after about a screen of scrolling, until the footer comes into view.
  function updateScrollUi() {

  // ---------- rendering ----------
  function render() {

    $('#n-ones').textContent = `${D.pulls.size}/${D.totalOnes}`;

  // Typing filters the list as before; matching players also appear in a dropdown so they can be pinned as chips.

      `<li role="option" id="sug-${i}" data-add="${esc(p)}" aria-selected="${i === S.sugIdx}">${esc(p)}${D.playerTeam.has(p) ? `<small>${esc(D.playerTeam.get(p))}</small>` : ''}</li>`).join('') : '';

  function setGroupControls(groups) {

    btn.textContent = anyClosed ? 'Expand all' : 'Collapse all';
  }
  // ---------- team shading ----------
  // Every card row (and 1/1 slot) tints only the tile behind the card number with
  // its team's color; the rest of the row stays neutral. Grouped by team, the whole group header is tinted too.
  // A card with several teams blends from its first team to its last (two colors at most).
  function teamFill(teamText) {
    const tints = [...new Set(String(teamText || '').split(' / ').map((t) => t.trim()))].map((t) => D.teamTint.get(t)).filter(Boolean);
    if (!tints.length) return '';

  // Team and player groups get a stats button at the right end of the header; it flips the group to its stats.
  const STATS_ICON = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 11V8M8 11V4.5M11.5 11V6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const hasStats = () => window.SetStats && S.tab === 'checklist' && ['team', 'player'].includes(S.groupBy[S.tab]);
  const statsable = (g) => hasStats() && !/^\((No team|No player)\)$/.test(g.name);
  function ghead(g, open, meta, bar, flipped) {

    if (!statsable(g)) return head;
    return `<div class="ghwrap" style="${headShade(g)}">${head}<button class="gstats" data-gstats="${esc(g.key)}" aria-pressed="${!!flipped}" aria-label="${flipped ? 'Back to cards' : 'Show stats'} for ${esc(g.name)}" title="${flipped ? 'Back to cards' : 'Stats'}">${STATS_ICON}</button></div>`;
  }
  // A group's card: its header, then its cards (when open) or, flipped, its stats. body() builds the cards on demand.
  function groupSection(g, open, meta, bar, body) {

  }
  // A flipped group that's no longer listed (filtered out, regrouped) drops the flip; the list dims only while one shows.
  function keepFlip(groups) {
    if (S.flip && !groups.some((g) => g.key === S.flip && statsable(g))) S.flip = null;
    $('#list').classList.toggle('focus', !!S.flip);
  }
  // Flip a group to its stats (next = its key) or back (next = null): the card turns away, the content swaps, and it
  // turns back in. Opening stats also opens the group, so flipping back shows its cards.
  let flipping = false;
  function flipStats(next) {
    if (flipping) return;
    const key = next || S.flip;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const secOf = () => document.querySelector(`#list .group[data-group="${CSS.escape(key)}"]`);
    const apply = () => {
      S.flip = next; if (next) taps().set(next, true);
      render();
      const sec = secOf(); if (!sec) return null;
      sec.querySelector('.gstats')?.focus({ preventScroll: true });
      if (next) { const r = sec.getBoundingClientRect(), top = $('#toolbar').getBoundingClientRect().bottom; if (r.top < top || r.top > innerHeight * 0.6) sec.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' }); }
      return sec;
    };
    const sec = secOf();
    if (reduce || !sec) { apply(); return; }
    flipping = true;
    sec.classList.add('flip-out');
    setTimeout(() => {
      flipping = false;
      const s2 = apply(); if (!s2) return;
      s2.classList.add('flip-in');
      s2.addEventListener('animationend', () => s2.classList.remove('flip-in'), { once: true });
    }, 170);
  }
  // The stats model is rebuilt only when what it counts changes: custom teams, pulls, or the product filter.
  // One product chosen in Filters → that product's parallels; otherwise every product.
  function statsPanel(g, footer) {
    const product = S.f.product.size === 1 ? +[...S.f.product][0] : null;
    const key = D.statsVersion + ':' + product;
    if (!D.stats || D.statsKey !== key) {
      D.stats = SetStats.model({ cards: D.cards, parsBySubset: D.parsBySubset, excByKey: D.excByKey, pulls: D.pulls, products: D.products, product });
      D.statsKey = key;
    }
    return SetStats.panel(D.stats, S.groupBy[S.tab] === 'team' ? 'team' : 'player', g.name, { footer });
  }
  const progress = (got, total) => `<span class="bar"><i style="width:${total ? Math.round(100 * got / total) : 0}%"></i></span>`;

  function renderChecklist() {
    const cards = D.cards.filter(cardMatches);
    S.current = { kind: 'cards', items: cards };
    $('#count').textContent = `${cards.length} card${cards.length === 1 ? '' : 's'}`;
    const groups = groupCards(cards);
    setGroupControls(groups);
    keepFlip(groups);
    if (!cards.length) return empty('No cards match these filters. Remove a chip or clear the filters.');
    $('#list').innerHTML = groups.map((g) => groupSection(g, isOpen(g), `${g.cards.length} card${g.cards.length === 1 ? '' : 's'}`, '', () => g.cards.map(cardRow).join(''))).join('');
  }
  // Row: number, player (or card name) with a chevron, and what the grouping doesn't show beneath (subset, or team
  // when grouped by subset) plus any custom print runs. The pill counts the card's parallels. Clicking the row lists them.
  const PARALLEL_GLYPH = '<svg class="pglyph" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1.5" width="9" height="12" rx="1.6" fill="none" stroke="url(#rainbow)" stroke-width="1.4"/><rect x="2" y="3.5" width="9" height="11" rx="1.6" fill="url(#rainbow)"/></svg>';
  // A 1/1 in an expanded card shows whether it's been pulled and opens the 1/1s tab narrowed to this card.
  // Print run in a heavier weight so the numbering stands out: "Prizms Blue <b>/149</b>".
  const parLabel = (l) => { const m = /^(.*?)\s(\/\d+)$/.exec(l); return m ? `${esc(m[1])} <b>${m[2]}</b>` : esc(l); };
  const stateIcon = (st) => st === 'pulled' ? ICON.check : st === 'off' ? ICON.lock : '';
  function oneChip(c, x) {
    const st = slotState(c, x.p);
    return `<button class="par one ${st}" data-one="${c.id}:${x.p.id}" title="Show in the 1/1s tab" aria-label="${esc(x.label)}, ${STATES[st][0].toLowerCase()}. Show in the 1/1s tab">` +
      `${parLabel(x.label)}${stateIcon(st)}</button>`;
  }
  function cardRow(c) {
    const open = S.cardsOpen.has(c.id);
    const by = S.groupBy[S.tab];
    // The group header already names the player when grouped by player, so the subset leads and the card name follows.
    const [title, detail] = by === 'player' ? [c.sub.Subset, c.name] : [c.name, by === 'subset' ? c.Team : c.sub.Subset];
    const pars = cardParallels(c);
    const n = pars.filter((x) => !x.na && !/^base$/i.test(x.label)).length; // the unnumbered Base entry isn't a parallel
    const excs = pars.filter((x) => x.exc).length;
    const sub = detail + (excs ? ` · ${excs} custom print run${excs === 1 ? '' : 's'}` : '');
    const body = open ? `<div class="pars">` + pars.map((x) => x.run === 1 && !x.na ? oneChip(c, x) :
      `<span class="${x.na ? 'par na' : x.exc ? 'par exc' : 'par'}">${parLabel(x.label)}</span>`).join('') + `</div>` : '';
    return `<div class="card" style="${rowShade(c)}"><button data-card="${c.id}" aria-expanded="${open}">
      <span class="num"><i>#</i>${c.Card_Number}</span>
      <span class="who"><strong>${esc(title)}<span class="chev" aria-hidden="true">${ICON.chev}</span></strong><small>${esc(sub)}</small></span>
      <span class="tags"><span class="badge pcount" role="img" aria-label="${n} parallel${n === 1 ? '' : 's'}">${n}${PARALLEL_GLYPH}</span></span></button>${body}</div>`;
  }
  function renderOnes() {
    const cards = D.cards.filter((c) => cardMatches(c) && visibleOnes(c).length);
    const totals = D.cards.filter(cardMatches).reduce((t, c) => { for (const p of productOnes(c)) { t.all++; if (pullOf(c, p)) t.got++; } return t; }, { all: 0, got: 0 });
    $('#count').textContent = `${totals.got} of ${totals.all} 1/1s pulled`;
    const groups = groupCards(D.cards.filter(cardMatches)).map((g) => ({ ...g, all: g.cards, cards: g.cards.filter((c) => visibleOnes(c).length) })).filter((g) => g.cards.length);
    setGroupControls(groups);
    S.current = { kind: 'slots', items: cards.flatMap((c) => visibleOnes(c).map((p) => ({ c, p }))) };
    keepFlip(groups);
    if (!cards.length) return empty(S.f.status.size && !S.f.status.has('live') ? `None of these 1/1s are ${S.f.status.has('pulled') ? 'pulled' : 'off market'} yet.` : 'No 1/1s match these filters.');
    // Progress counts every 1/1 in the group's cards (ignoring the status filter), so "Live" still shows how far along a group is.
    $('#list').innerHTML = groups.map((g) => {
      let got = 0, all = 0;
      for (const c of g.all) for (const p of productOnes(c)) { all++; if (pullOf(c, p)) got++; }
      return groupSection(g, isOpen(g), `${got} of ${all} pulled`, progress(got, all), () => g.cards.flatMap((c) => visibleOnes(c).map((p) => slotRow(c, p))).join(''));
    }).join('');
  }
  const canEdit = () => inGrist || !!demo;
  // A 1/1 slot uses the card row layout: team tile with the card number, name and detail line, and the status pill
  // where the parallel count sits on the Checklist tab. The pill looks like the Checklist's 1/1 chips and opens a
  // menu of the three states.
  const slotTitle = (c, p) => S.groupBy[S.tab] === 'player'
    ? [c.sub.Subset, `${p.Parallel} · ${c.name}`]
    : [c.name, `${p.Parallel} · ${S.groupBy[S.tab] === 'subset' ? c.Team : c.sub.Subset}`];
  function slotRow(c, p) {
    const st = slotState(c, p), [title, detail] = slotTitle(c, p);
    const pill = `<button class="par one status ${st}" data-status="${c.id}:${p.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Status: ${STATES[st][0]}. Change status for ${esc(c.name)}, ${esc(p.Parallel)}" ${canEdit() ? '' : 'disabled'}>` +
      `${stateIcon(st)}${st === 'live' ? 'Live' : 'Pulled'}${canEdit() ? `<span class="car">${ICON.caret}</span>` : ''}</button>`;
    return `<div class="card slot" data-slotrow="${c.id}:${p.id}" style="${rowShade(c)}"><div class="slotrow">
      <span class="num"><i>#</i>${c.Card_Number}</span>
      <span class="who"><strong>${esc(title)}</strong><small>${esc(detail)}</small></span>
      <span class="acts">${pill}</span>
    </div></div>`;
  }
  function empty(msg) { $('#list').classList.remove('focus'); $('#list').innerHTML = `<div class="empty">${esc(msg)}</div>`; }

  // ---------- interactions ----------
  function onListClick(e) {
    const gs = e.target.closest('[data-gstats]');
    if (gs) { const k = gs.dataset.gstats; flipStats(S.flip === k ? null : k); return; }
    // While a group shows its stats, a click anywhere else on the list flips it back; nothing else in the list reacts.
    if (S.flip) { if (!e.target.closest('.group.flipped')) flipStats(null); return; }
    const gh = e.target.closest('[data-gkey]');
    if (gh) { taps().set(gh.dataset.gkey, gh.getAttribute('aria-expanded') !== 'true'); render(); return; }
    const st = e.target.closest('[data-status]');
    if (st) { openStatusMenu(st); return; }
    const one = e.target.closest('[data-one]');
    if (one) { showOneOfOne(one.dataset.one); return; }
    const cb = e.target.closest('[data-card]');
    if (cb) { const id = +cb.dataset.card; S.cardsOpen.has(id) ? S.cardsOpen.delete(id) : S.cardsOpen.add(id); render(); }
  }
  // Jump to the 1/1s tab with only this card showing (its subset and players), open its group, and point at the slot.
  function showOneOfOne(key) {
    const [cid] = key.split(':').map(Number);
    const c = D.cards.find((x) => x.id === cid); if (!c) return;
    Object.values(S.f).forEach((set) => set.clear());
    S.f.subset.add(String(c.Subset));
    S.players = new Set(c.playerNames);
    S.q = ''; $('#q').value = '';
    S.tab = 'ones'; store.set('tab', S.tab);
    for (const [k] of groupsOf[S.groupBy.ones](c)) S.taps.ones.set(k, true);
    render();
    const row = document.querySelector(`[data-slotrow="${key}"]`);
    if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); row.querySelector('.par.status')?.focus({ preventScroll: true }); }
  }
  // ---------- menus ----------
  // The popup (dropdown, or bottom sheet on phones) and the header's view and set menus live in lib/nav.js.
  const openMenu = (...a) => Nav.openMenu(...a), closeMenu = (r) => Nav.closeMenu(r);

  // Status menu: Live / Pulled / Off market for one 1/1.
  function openStatusMenu(pill) {
    if (!canEdit()) return;
    const key = pill.dataset.status, [cid, pid] = key.split(':').map(Number);
    const c = D.cards.find((x) => x.id === cid), p = c && c.ones.find((x) => x.id === pid); if (!p) return;
    const cur = slotState(c, p);
    const dot = { live: '<span class="ldot"></span>', pulled: '<span class="gdot"></span>', off: ICON.lock };
    const items = stateKeys().map((k) => `<button class="mi" role="menuitemradio" aria-checked="${k === cur}" data-set="${k}"><span class="mic">${dot[k]}</span><span><b>${STATES[k][0]}</b><small>${STATES[k][1]}</small></span>${k === cur ? `<span class="mic">${ICON.check}</span>` : ''}</button>`).join('');
    const box = openMenu(pill, { label: `Status for ${esc(c.name)}, ${esc(p.Parallel)}`, items,
      sheetHead: `<div class="sh"><strong>#${c.Card_Number} ${esc(c.name)}</strong><small>${esc(p.Parallel)} · ${esc(c.sub.Subset)} · ${esc(c.Team)}</small></div>` });
    if (box) box.onclick = (e) => { const b = e.target.closest('[data-set]'); if (b) { closeMenu(true); setStatus(key, b.dataset.set); } };
  }

  // Live removes the logged pull; Pulled and Off market log one (or flip Off_Market on the one already logged).
  async function setStatus(key, next) {
    const [cardId, parId] = key.split(':').map(Number);
    const existing = D.pulls.get(key);
    const cur = !existing ? 'live' : existing.Off_Market ? 'off' : 'pulled';
    if (next === cur) return;
    if (existing && existing.id < 0) { toast('Still saving the last change. Try again in a moment.'); return; }
    let action;
    if (next === 'live') { D.pulls.delete(key); action = ['RemoveRecord', 'Pulls', existing.id]; }
    else if (existing) { existing.Off_Market = next === 'off'; action = ['UpdateRecord', 'Pulls', existing.id, { Off_Market: next === 'off' }]; }
    else {
      const rec = { Card_Key: cardId, Parallel_Key: parId }; if (next === 'off') rec.Off_Market = true;
      D.pulls.set(key, { id: -1, ...rec, Off_Market: next === 'off' }); action = ['AddRecord', 'Pulls', null, rec];
    }
    render();
    try { await source.act([action]); toast(`Marked ${STATES[next][0].toLowerCase()}`); }
    catch (err) { toast(writeError(err)); }
    reloadPulls();
  }
  function writeError(err) {
    const m = String(err && err.message || err);
    return /access|permission|denied|blocked/i.test(m) ? 'Not saved. Checking off 1/1s needs the edit link.' : 'Not saved: ' + m;
  }

  // ---------- CSV ----------
  function download() {
    const cur = S.current || { kind: 'cards', items: [] };
    let head, body;
    if (cur.kind === 'slots') {
      head = ['Team', 'Card Name', 'Players', 'Subset', 'Card Number', 'Parallel', 'Pulled'];
      if (D.hasOffMarket) head.push('Off Market');
      if (D.hasReported) head.push('Reported');
      body = cur.items.map(({ c, p }) => {
        const pl = pullOf(c, p);
        const r = [c.Team, c.name, c.playerNames.join('; '), c.sub.Subset, c.Card_Number, p.Parallel, pl ? 'Yes' : 'No'];
        if (D.hasOffMarket) r.push(pl ? (pl.Off_Market ? 'Yes' : 'No') : '');
        if (D.hasReported) r.push(pl && pl.Reported_At ? isoDate(pl.Reported_At) : '');
        return r;
      });
    } else {
      head = ['Subset', 'Card Number', 'Card Name', 'Players', 'Team', 'Position', 'Types', 'Parallels', '1/1s'];
      body = cur.items.map((c) => [c.sub.Subset, c.Card_Number, c.name, c.playerNames.join('; '), c.Team, c.Position || '', TYPES.filter((t) => c.sub[t]).map(typeLabel).join('; '),
        cardParallels(c).map((x) => x.label).join('; '), c.ones.map((p) => p.Parallel).join('; ')]);
    }
    const csv = [head].concat(body).map((r) => r.map(csvCell).join(',')).join('\r\n');
    const name = (cur.kind === 'slots' ? 'one-of-ones' : 'checklist') + '.csv';
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast(`Downloaded ${body.length} rows`);
    } catch (e) {
      navigator.clipboard?.writeText(csv).then(() => toast('Download blocked here. Copied the CSV to your clipboard instead.'));
    }
  }
  function csvCell(v) {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // ---------- utils ----------
  // Grist DateTime values are seconds since the epoch.
  const isoDate = (sec) => new Date(sec * 1000).toLocaleDateString('en-CA');
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
  let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

  // ---------- boot ----------
  if (inGrist) {
    grist.ready({ requiredAccess: 'full' });
    let booted = false;
    grist.onRecords(() => { if (booted) reloadPulls(); });
    loadAll().then(() => { booted = true; }).catch((e) => empty('Could not read the document: ' + (e.message || e) + '. Give this widget full document access in its settings.'));
    Nav.mount({ view: 'checklist', demo, inGrist });
  } else if (demo) {
    loadAll(); Nav.mount({ view: 'checklist', demo, inGrist });
  } else {
    empty('This page is a Grist custom widget. Add it to a Grist page as a custom widget to use it.');
  }
})();
</script>
</body>
</html>
