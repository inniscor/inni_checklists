<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="lib/stats.js"></script>
<script src="lib/teams.js"></script>
<style>
  /* Same palette and type as the checklist (index.html). */
  :root {
    --bg: #E9EDF1; --surface: #FFFFFF; --ink: #14212E; --muted: #5E6B78; --line: #D3DAE1;
    --pitch: #0F7A55; --pitch-soft: #E2F2EB; --slab: #1B2430; --focus: #2F6FDB;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }
  .ico { width: 12px; height: 12px; display: block; flex: none; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sethead { padding: 12px 2px 0; min-width: 0; }
  .settitle { margin: 0; font-family: var(--cond); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .setsub { color: var(--muted); font-size: 13px; }

  /* Tabs: Default, and Break (not ready yet: shown, not selectable). */
  .tabbar { padding: 10px 0 6px; }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .tab { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 6px; font-family: var(--cond); font-weight: 600; font-size: 17px; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tab:disabled { cursor: default; opacity: .45; }

  /* Search, then the Group by and Rank by pills. */
  #q { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; }
  .seglabel { font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); margin-right: 6px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .summary { margin: 14px 2px 6px; color: var(--muted); font-size: 14px; }

  /* Ranked rows: a team-tinted card with the rank, the name and the other numbers, then the ranked number with its share
     bar (middle tick = an even share, full at twice that), then the chart button. The row or the button flips the card
     to the stats panel (lib/stats.js); the rest of the list dims and can't be used until it flips back. */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; overflow: hidden; transition: opacity .2s, filter .2s, box-shadow .2s; }
  .ghwrap { display: flex; align-items: stretch; }
  .rowmain { flex: 1; min-width: 0; border: 0; background: none; text-align: left; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(120px, 32%); gap: 12px; align-items: center; }
  .rk { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); text-align: center; }
  .who { min-width: 0; }
  .who strong { display: block; font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { display: block; color: var(--muted); font-size: 13px; }
  .val { display: grid; gap: 5px; }
  .val .num { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .val b { font-family: var(--cond); font-weight: 700; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .val small { color: var(--muted); font-size: 12.5px; }
  .meter { position: relative; display: block; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .7); }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--pitch); }
  .meter .even { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 1px var(--surface); }
  .gstats { flex: none; width: 46px; border: 0; border-left: 1px solid rgba(20, 33, 46, .1); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .gstats .ico { width: 18px; height: 18px; }
  .gstats:hover { color: var(--ink); background: rgba(255, 255, 255, .45); }
  .gstats[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, .6); }
  #list.focus { cursor: pointer; }
  #list.focus .group:not(.flipped) { opacity: .35; filter: saturate(.5); pointer-events: none; }
  #list.focus .group.flipped { cursor: auto; box-shadow: 0 10px 28px rgba(20, 33, 46, .16); }
  .group.flipped .rowmain { cursor: default; }
  @keyframes flipOut { to { transform: perspective(1400px) rotateY(90deg); } }
  @keyframes flipIn { from { transform: perspective(1400px) rotateY(-90deg); } }
  .group.flip-out { animation: flipOut .17s ease-in forwards; }
  .group.flip-in { animation: flipIn .22s ease-out; }
  .btn.ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn.ghost:hover { border-color: var(--ink); }
  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 14px; max-width: 92vw; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) {
    .rowmain { grid-template-columns: 26px minmax(0, 1fr) 96px; gap: 8px; }
    .who strong { font-size: 18px; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <header class="sethead" id="sethead"><h1 class="settitle" id="settitle">Dashboard</h1><div class="setsub" id="setsub"></div></header>
    <button class="custbtn" id="custbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="ctdrawer"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7m3 0h1M2.5 11.5h2m3 0h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span class="lab">Customize</span><span class="cdot" hidden></span></button>
  </div>
  <div class="tabbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-default" aria-selected="true">Default</button>
      <button class="tab" role="tab" id="tab-break" aria-selected="false" disabled>Break</button>
    </div>
  </div>
  <input type="search" id="q" placeholder="Search teams" aria-label="Search teams" autocomplete="off">
  <div class="controls">
    <span><span class="seglabel">Group by</span><span class="seg" role="group" aria-label="Group by" id="groupby">
      <button data-kind="team" aria-pressed="true">Team</button><button data-kind="player" aria-pressed="false">Player</button></span></span>
    <span><span class="seglabel">Rank by</span><span class="seg" role="group" aria-label="Rank by" id="rankby"></span></span>
  </div>
  <div class="summary" id="summary"></div>
  <main id="list" aria-live="polite"><div class="empty">Loading…</div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const int = (n) => Math.round(n).toLocaleString('en-US');
  const pct1 = (x) => x === 0 ? '0%' : x < 0.001 ? '<0.1%' : (x * 100).toFixed(1) + '%';
  const STATS_ICON = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.5 11V8M8 11V4.5M11.5 11V6.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const METRICS = [['autos', 'Autos'], ['hits', 'Case hits'], ['live', '1/1s live'], ['cards', 'Cards']];

  // ---------- data ----------
  // The same doc tables the checklist reads. Teams is optional (no shading without it).
  const demo = window.DEMO_DATA || null;
  const inGrist = !demo && window.grist && window.self !== window.top;
  const fetchTable = (t) => demo ? Promise.resolve(demo[t]) : grist.docApi.fetchTable(t);
  const refs = (v) => Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (typeof v === 'string' && v.startsWith('[') ? JSON.parse(v) : []);
  const rows = (cols) => cols.id.map((id, i) => { const o = { id }; for (const k in cols) o[k] = cols[k][i]; return o; });
  const D = {};
  const S = { kind: 'team', metric: 'autos', q: '', flip: null };

  async function loadAll() {
    const [sub, prod, cards, pars, exc, pulls, plyr] = await Promise.all(
      ['Subsets', 'Products', 'Cards', 'Parallels', 'PrintRunExceptions', 'Pulls', 'Players'].map(fetchTable));
    D.baseTint = new Map();
    try { for (const t of rows(await fetchTable('Teams'))) if (t.Team && t.Tint) D.baseTint.set(String(t.Team).trim(), String(t.Tint).trim()); } catch (e) {}
    const subById = new Map(rows(sub).map((s) => [s.id, s]));
    const playerName = new Map(rows(plyr).map((p) => [p.id, String(p.Player_Name ?? '').trim()]));
    D.products = rows(prod);
    D.parsBySubset = new Map();
    for (const p of rows(pars)) { p.products = new Set(refs(p.ParallelProducts_Product)); if (!D.parsBySubset.has(p.Subset)) D.parsBySubset.set(p.Subset, []); D.parsBySubset.get(p.Subset).push(p); }
    D.excByKey = new Map(rows(exc).map((e) => [e.Card_Key + ':' + e.Parallel_Key, e]));
    D.pulls = new Map(rows(pulls).map((p) => [p.Card_Key + ':' + p.Parallel_Key, p]));
    D.cards = rows(cards).map((c) => {
      c.sub = subById.get(c.Subset) || { Subset: '' };
      c.playerNames = refs(c.Players).map((id) => playerName.get(id)).filter(Boolean);
      c.baseTeam = String(c.Team || '');
      c.baseTeams = [...new Set(c.baseTeam.split(' / ').map((t) => t.trim()).filter(Boolean))];
      return c;
    });
    D.players = [...new Set(D.cards.flatMap((c) => c.playerNames))].sort();
    D.baseTeamNames = new Set(D.cards.flatMap((c) => c.baseTeams));
    D.basePlayerTeam = new Map();
    for (const c of D.cards) for (const n of c.playerNames) if (!D.basePlayerTeam.has(n) && c.baseTeams.length === 1) D.basePlayerTeam.set(n, c.baseTeams[0]);
    applyTeams();
    if (!D.mounted) {
      D.mounted = true;
      SetStats.injectStyles();
      MyTeams.mount({
        players: () => D.players,
        baseTeamNames: () => D.baseTeamNames,
        teamCards: (name) => D.cards.reduce((n, c) => n + (c.teams.includes(name) ? 1 : 0), 0),
        toast,
        changed: () => { applyTeams(); render(); },
        renamed: (from, to) => { if (S.flip === 't' + from) S.flip = 't' + to; },
      });
      bind();
    }
    render();
  }
  // Custom teams (lib/teams.js) set each card's teams; the stats model is rebuilt from them.
  function applyTeams() {
    Object.assign(D, MyTeams.apply({ cards: D.cards, basePlayerTeam: D.basePlayerTeam, baseTint: D.baseTint, players: D.players }));
    D.model = SetStats.model({ cards: D.cards, parsBySubset: D.parsBySubset, excByKey: D.excByKey, pulls: D.pulls, products: D.products, product: null });
  }

  // The set's name: from sets.json when this doc is listed, else the doc's own name, else "Dashboard".
  async function loadTitle() {
    let sets = null, docId = '', docName = '';
    try {
      if (demo) sets = window.DEMO_SETS || null;
      else { const r = await fetch(new URL('../../sets.json', location.href)); if (r.ok) sets = await r.json(); }
    } catch (e) {}
    if (demo) { docId = window.DEMO_DOC_ID || ''; docName = window.DEMO_DOC_NAME || ''; }
    else if (inGrist) {
      try {
        const t = await grist.docApi.getAccessToken({ readOnly: true });
        docId = (/\/docs\/([^/?#]+)/.exec(t.baseUrl || '') || [])[1] || '';
        const r = await fetch(`${t.baseUrl}?auth=${encodeURIComponent(t.token)}`);
        if (r.ok) { const n = String((await r.json()).name || '').trim(); if (n && n !== docId) docName = n; }
      } catch (e) {}
    }
    const cur = (sets && Array.isArray(sets.years) ? sets.years : []).flatMap((y) => y.sets || []).find((x) => docId && x.doc === docId);
    $('#settitle').textContent = cur ? cur.name : docName || 'Dashboard';
    $('#setsub').textContent = cur && cur.sub ? cur.sub : '';
  }

  // ---------- rendering ----------
  const keyOf = (name) => (S.kind === 'team' ? 't' : 'p') + name;
  function fillOf(teams) {
    const tints = [...new Set(teams)].map((t) => D.teamTint.get(t)).filter(Boolean);
    if (!tints.length) return '';
    const a = tints[0], b = tints[tints.length - 1];
    return a === b ? a : `linear-gradient(90deg, ${a}, ${b})`;
  }
  const teamsOf = (name) => S.kind === 'team' ? [name] : (D.playerTeam.get(name) ? [D.playerTeam.get(name)] : []);
  function others(full) {
    const parts = { autos: `${int(full.autos)} auto${Math.round(full.autos) === 1 ? '' : 's'}`, hits: `${int(full.hits)} case hit${Math.round(full.hits) === 1 ? '' : 's'}`,
      live: `${int(full.ones.live)} of ${int(full.ones.all)} 1/1s live`, cards: `${int(full.cards)} card${Math.round(full.cards) === 1 ? '' : 's'}` };
    return METRICS.filter(([k]) => k !== S.metric).map(([k]) => parts[k]).join(' · ');
  }
  function render() {
    MyTeams.render(true);
    const noun = S.kind === 'team' ? 'teams' : 'players';
    $('#q').placeholder = S.kind === 'team' ? 'Search teams' : 'Search players or teams';
    $('#q').setAttribute('aria-label', $('#q').placeholder);
    document.querySelectorAll('#groupby button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.kind === S.kind));
    $('#rankby').innerHTML = METRICS.map(([k, l]) => `<button data-metric="${k}" aria-pressed="${S.metric === k}">${l}</button>`).join('');
    const all = SetStats.rankRows(D.model, S.kind, S.metric);
    const q = MyTeams.norm(S.q);
    const shown = q ? all.filter((r) => MyTeams.norm(r.name).includes(q) || teamsOf(r.name).some((t) => MyTeams.norm(t).includes(q))) : all;
    if (S.flip && !shown.some((r) => keyOf(r.name) === S.flip)) S.flip = null;
    $('#list').classList.toggle('focus', !!S.flip);
    $('#summary').textContent = shown.length === all.length ? `${all.length} ${noun}` : `${shown.length} of ${all.length} ${noun}`;
    if (!shown.length) { $('#list').innerHTML = `<div class="empty">No ${noun} match “${esc(S.q.trim())}”.</div>`; return; }
    const tot = all.length && all[0].even;
    $('#list').innerHTML = shown.map((r) => {
      const key = keyOf(r.name), flipped = S.flip === key, fill = fillOf(teamsOf(r.name));
      const detail = [S.kind === 'player' ? teamsOf(r.name).join(' / ') : '', others(r.full)].filter(Boolean).join(' · ');
      const label = METRICS.find(([k]) => k === S.metric)[1];
      const valueText = S.metric === 'live' ? `${int(r.value)}<small> of ${int(r.full.ones.all)}</small>` : int(r.value);
      return `<section class="group${flipped ? ' flipped' : ''}" data-group="${esc(key)}"${S.flip && !flipped ? ' inert' : ''}>
        <div class="ghwrap" style="${fill ? `background:${fill}` : ''}">
          <button class="rowmain" data-flip="${esc(key)}" aria-label="${esc(r.name)}: ${label} ${int(r.value)}, rank ${r.rank}. ${flipped ? 'Back to the list' : 'Show stats'}">
            <span class="rk">${r.rank}</span>
            <span class="who"><strong>${esc(r.name)}</strong><small>${esc(detail)}</small></span>
            <span class="val"><span class="num"><b>${valueText}</b><small>${pct1(r.share)}</small></span>
              <span class="meter" role="img" aria-label="${pct1(r.share)} of the set, an even share is ${pct1(tot)}"><i style="width:${Math.min(100, tot ? 50 * r.share / tot : 0)}%"></i><span class="even"></span></span></span>
          </button>
          <button class="gstats" data-flip="${esc(key)}" aria-pressed="${flipped}" aria-label="${flipped ? 'Back to the list' : 'Show stats'} for ${esc(r.name)}" title="${flipped ? 'Back to the list' : 'Stats'}">${STATS_ICON}</button>
        </div>
        ${flipped ? SetStats.panel(D.model, S.kind, r.name, { footer: `<button class="btn ghost" data-flip="${esc(key)}">Back to the list</button>` }) : ''}
      </section>`;
    }).join('');
  }

  // Flip a row to its stats (next = its key) or back (null): the card turns away, the content swaps, it turns back in.
  let flipping = false;
  function flipTo(next) {
    if (flipping) return;
    const key = next || S.flip;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const secOf = () => document.querySelector(`#list .group[data-group="${CSS.escape(key)}"]`);
    const apply = () => {
      S.flip = next; render();
      const sec = secOf(); if (!sec) return null;
      sec.querySelector('.gstats')?.focus({ preventScroll: true });
      if (next) { const r = sec.getBoundingClientRect(); if (r.top < 0 || r.top > innerHeight * 0.6) sec.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' }); }
      return sec;
    };
    const sec = secOf();
    if (reduce || !sec) { apply(); return; }
    flipping = true;
    sec.classList.add('flip-out');
    setTimeout(() => {
      flipping = false;
      const s2 = apply(); if (!s2) return;
      s2.classList.add('flip-in');
      s2.addEventListener('animationend', () => s2.classList.remove('flip-in'), { once: true });
    }, 170);
  }

  function bind() {
    $('#q').oninput = (e) => { S.q = e.target.value; render(); };
    $('#groupby').onclick = (e) => { const b = e.target.closest('[data-kind]'); if (b && b.dataset.kind !== S.kind) { S.kind = b.dataset.kind; S.flip = null; render(); } };
    $('#rankby').onclick = (e) => { const b = e.target.closest('[data-metric]'); if (b) { S.metric = b.dataset.metric; render(); } };
    $('#list').addEventListener('click', (e) => {
      const f = e.target.closest('[data-flip]');
      if (f) { const k = f.dataset.flip; if (S.flip && S.flip !== k) flipTo(null); else flipTo(S.flip === k ? null : k); return; }
      // While a row shows its stats, a click anywhere else on the list flips it back.
      if (S.flip && !e.target.closest('.group.flipped')) flipTo(null);
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.flip && !MyTeams.isOpen()) { e.preventDefault(); flipTo(null); } });
  }

  let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
  const fail = (e) => { $('#list').innerHTML = `<div class="empty">Could not read the document: ${esc(e.message || e)}. Give this widget full document access in its settings.</div>`; };

  // ---------- boot ----------
  if (!window.SetStats || !window.MyTeams) { $('#list').innerHTML = '<div class="empty">The dashboard’s files didn’t load. Reload the page.</div>'; return; }
  if (demo) { loadAll().catch(fail); loadTitle(); }
  else if (inGrist) {
    grist.ready({ requiredAccess: 'full' });
    // Read-only. It reloads when its own table changes, e.g. a pull logged or a team color edited.
    let booted = false;
    grist.onRecords(() => { if (booted) loadAll().catch(fail); });
    loadAll().then(() => { booted = true; }).catch(fail);
    loadTitle();
  } else $('#list').innerHTML = '<div class="empty">This page is a Grist custom widget. Add it to a Grist page as a custom widget to use it.</div>';
})();
</script>
</body>
</html>
