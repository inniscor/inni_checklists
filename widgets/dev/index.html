<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="lib/stats.js"></script>
<style>
  :root {
    --bg: #E9EDF1;
    --surface: #FFFFFF;
    --ink: #14212E;
    --muted: #5E6B78;
    --line: #D3DAE1;
    --pitch: #0F7A55;
    --pitch-soft: #E2F2EB;
    --slab: #1B2430;
    --focus: #2F6FDB;
    --radius-s: 6px;
    --radius-m: 10px;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }

  /* Tabs (scroll away with the page) */
  .tabbar { padding: 10px 0 6px; }

  /* Toolbar (sticky): the search box, the Filters button with its chips, and the filters panel stay in view while
     everything else scrolls. It spans the .wrap padding so rows don't show at its sides; a shadow appears once it sticks.
     An open filters panel scrolls on its own when it's taller than the room left on screen. */
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -12px; padding: 6px 12px 8px; transition: box-shadow .15s; }
  .toolbar.stuck { box-shadow: 0 8px 12px -10px rgba(20, 33, 46, .35); }
  .summary button, .summary a, #list .card, #list button, .foot button { scroll-margin-top: var(--stick-h, 0px); }
  .toolbar .fpanel { max-height: calc(100vh - 130px); overflow-y: auto; overscroll-behavior: contain; }

  /* Back to top: a footer at the end of the list, and a floating button once the page has scrolled a screen or so. */
  .foot { display: flex; justify-content: center; padding: 20px 0 4px; }
  .fab { position: fixed; right: 16px; bottom: 16px; z-index: 8; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 9px 14px 9px 12px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 6px 18px rgba(20, 33, 46, .25); opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .15s, transform .15s, visibility .15s; }
  .fab.show { opacity: 1; visibility: visible; transform: none; }
  .fab .ico, .foot .ico { width: 15px; height: 15px; }
  @media (max-width: 600px) { .fab { padding: 11px; } .fab span { display: none; } }
  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 4px; }
  .tab { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: var(--radius-s); font-family: var(--cond); font-weight: 600; font-size: 17px; letter-spacing: .01em; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--ink); color: #fff; }
  .tab .n { font-weight: 500; opacity: .75; margin-left: 4px; }

  /* Search + filter pills */
  #q { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface); font-size: 16px; }
  .fgroup { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: start; margin-top: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .fgroup .flabel { font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); padding-top: 4px; }
  .fpanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 2px 12px 12px; margin-top: 8px; }
  .fbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
  .fbtn[aria-expanded="true"] { border-color: var(--ink); }
  .fbtn b { font-weight: 600; }
  .fbtn .chev { font-size: 10px; color: var(--muted); transition: transform .15s; }
  .fbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .toggle { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 14px; cursor: pointer; }
  .chip span { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 12px; }
  .link { border: 0; background: none; color: var(--focus); padding: 4px 2px; cursor: pointer; font-size: 14px; }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 14px 2px 6px; color: var(--muted); font-size: 14px; }
  .summary { flex-wrap: wrap; }
  .summary .left { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  #download { margin-left: auto; }
  @media (max-width: 600px) { .summary .left { flex-basis: 100%; } #download { margin-left: 0; } #viewbar .seglabel { display: none; } #viewbar { margin-left: auto; } }
  #viewbar { margin-left: 4px; }
  .btn { border: 1px solid var(--ink); background: var(--surface); border-radius: var(--radius-s); padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--ink); color: #fff; }

  /* Search with player suggestions dropdown */
  .search { position: relative; }
  .suggest { position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); box-shadow: 0 6px 18px rgba(20, 33, 46, .12); }
  .suggest .shead { padding: 4px 8px 2px; font-size: 12px; color: var(--muted); }
  .suggest li[role="option"] { padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 15px; }
  .suggest li[role="option"] small { color: var(--muted); margin-left: 6px; }
  .suggest li[aria-selected="true"], .suggest li[role="option"]:hover { background: var(--bg); }

  /* Groups */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); margin-top: 10px; overflow: hidden; }
  .gname { font-family: var(--cond); font-weight: 700; font-size: 20px; line-height: 1.1; }
  .gmeta { color: var(--muted); font-size: 14px; text-align: right; }
  .bar { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--pitch); }

  /* Card rows */
  .card { border-top: 1px solid var(--line); }
  /* Card rows and 1/1 slot rows share one grid: number (centered in the team tile), name + detail, pill.
     The number column spans the tile (left 6px, width --blkw - 10px) so the number sits in its middle. */
  .card > button, .card > .slotrow { width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; display: grid; grid-template-columns: 61px 1fr auto; gap: 15px; align-items: center; }
  .card > button { cursor: pointer; }
  .card > button .num, .card > .slotrow .num { justify-self: center; }
  .who strong .chev { display: inline-grid; vertical-align: -1px; margin-left: 6px; transition: transform .15s; }
  .card > button[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .num { font-family: var(--cond); font-weight: 600; font-size: 18px; color: var(--muted); }
  .who strong { display: block; font-weight: 600; }
  .who small { color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 4px; }
  .card > button .tags, .card > .slotrow .acts { align-self: start; padding-top: 2px; }
  @media (max-width: 600px) { .tags .badge { white-space: normal; max-width: 30vw; text-align: right; line-height: 1.2; padding: 2px 7px; } .card > button, .card > .slotrow { grid-template-columns: 54px 1fr auto; gap: 14px; } }
  .badge { font-family: var(--cond); font-weight: 600; font-size: 13px; padding: 1px 7px; border-radius: 4px; background: var(--slab); color: #fff; white-space: nowrap; }
  .badge.pcount { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; padding: 3px 9px 3px 10px; }
  .pglyph { width: 17px; height: 17px; display: block; }
  .badge.var { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .pars { padding: 2px 12px 12px 88px; display: flex; flex-wrap: wrap; gap: 5px; }
  .par { font-size: 13px; padding: 2px 8px; border-radius: 4px; background: var(--bg); }
  .par.exc { background: transparent; border: 1px solid var(--ink); }
  .par.na { text-decoration: line-through; color: var(--muted); }
  /* 1/1 chips and the 1/1s tab's status pill share three looks: live = dark with a rainbow ring,
     pulled = green with a check, off market = deep green with a lock. */
  .par.one { position: relative; background: var(--slab); color: #fff; border: 0; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .par.one::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: conic-gradient(from 210deg, #7FE3D4, #B4A2F5, #F5B3C8, #F3E39A, #7FE3D4); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .par.one:hover { outline: 2px solid var(--focus); outline-offset: 1px; }
  .par.one.pulled { background: var(--pitch); }
  .par.one.off { background: #0B5A3F; }
  .par.one.pulled::before, .par.one.off::before { display: none; }
  .par.one svg { width: 12px; height: 12px; display: block; }
  .par.one:disabled { cursor: default; } .par.one:disabled:hover { outline: 0; }
  .par.status { font-size: 15px; font-weight: 600; padding: 4px 12px; gap: 5px; white-space: nowrap; }
  .par.one.status .ico { width: 13px; height: 13px; }
  .par.status .car { display: inline-grid; margin-left: 1px; opacity: .8; } .par.status .car .ico { width: 11px; height: 11px; }
  @keyframes flash { from { background: var(--pitch-soft); } to { background: transparent; } }
  .card.slot.flash { animation: flash 2.4s ease-out; }

  /* Status menu: a dropdown under the pill on wider screens, a bottom sheet on phones (tap a choice to apply). */
  .menu { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(20,33,46,.16); padding: 4px; width: 230px; }
  .scrim { position: fixed; inset: 0; background: rgba(20,33,46,.35); z-index: 19; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px 14px 18px; box-shadow: 0 -8px 24px rgba(20,33,46,.18); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 2px auto 10px; }
  .sh { padding: 2px 4px 10px; } .sh strong { display: block; font-size: 16px; } .sh small { color: var(--muted); font-size: 13px; }
  .mi { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; border-radius: 8px; padding: 7px 8px; font-size: 14px; }
  .sheet .mi { padding: 12px 10px; font-size: 16px; }
  .mi b { font-weight: 600; }
  /* Set switcher: the set's name as the page title; with other sets listed it opens a menu of them. */
  .sethead { padding: 12px 2px 0; }
  .setbtn { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 0 -4px; border: 0; background: none; padding: 2px 4px; border-radius: 8px; font-family: var(--cond); font-weight: 700; font-size: 24px; line-height: 1.15; color: var(--ink); }
  button.setbtn { cursor: pointer; } button.setbtn:hover { background: var(--surface); }
  .setbtn .car { display: inline-grid; color: var(--muted); } .setbtn .car .ico { width: 16px; height: 16px; }
  .setsub { color: var(--muted); font-size: 13px; padding: 0 2px; }
  .menu.setmenu { width: 300px; }
  .menu { max-height: calc(100vh - 16px); overflow-y: auto; } .sheet { max-height: 85vh; overflow-y: auto; }
  .mi.msec { grid-template-columns: 1fr auto; padding: 9px 10px; }
  .mi.msec b { font-family: var(--cond); font-weight: 700; font-size: 18px; }
  .mi.msec small { display: inline; margin-left: 8px; font-family: var(--body); font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .mi.msec .chev { transition: transform .15s; } .mi.msec[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .msub { margin: 0 0 4px 12px; padding-left: 6px; border-left: 2px solid var(--line); }
  .mi.si { grid-template-columns: 1fr auto; text-decoration: none; padding: 9px 10px; }
  .mi.si b { font-family: var(--cond); font-weight: 700; font-size: 18px; } .mi.si small { font-size: 12.5px; }
  .mi[aria-current="page"] { background: var(--bg); }
  .mi.soon { cursor: default; color: var(--muted); } .mi.soon b { font-weight: 600; } .mi.soon:hover { background: none; } .mi small { display: block; color: var(--muted); font-size: 12px; }
  .mi[aria-checked="true"] { background: var(--bg); } .mi:hover, .mi:focus-visible { background: var(--bg); outline: 2px solid var(--focus); outline-offset: -2px; }
  .mic { display: grid; place-items: center; color: #0B5A3F; } .mic .ico { width: 14px; height: 14px; }
  .ldot { width: 12px; height: 12px; border-radius: 50%; background: var(--slab); box-shadow: 0 0 0 2px #B4A2F5, 0 0 0 3.5px #F5B3C8; display: block; }
  .gdot { width: 12px; height: 12px; border-radius: 50%; background: var(--pitch); display: block; }

  /* Team tile: a rounded, inset tile in the team's tint behind the card number.
     --blkw is where that area ends; the tile sits 6px inside it. */
  .card { --blkw: 83px; position: relative; }
  .card > button, .card > .pars, .card > .slotrow { position: relative; z-index: 1; }
  .card[style*="--blk"]::before { content: ""; position: absolute; z-index: 0; left: 6px; top: 6px; bottom: 6px; width: calc(var(--blkw) - 10px); border-radius: 8px; background: var(--blk); }
  @media (max-width: 600px) { .card { --blkw: 76px; } }

  /* Group by switch */
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seglabel { font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); margin-right: 6px; }

  /* Group header as a button */
  .ghead { width: 100%; border: 0; background: none; text-align: left; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: 16px 1fr auto; gap: 2px 8px; align-items: center; }
  .ghead .chev { font-size: 11px; color: var(--muted); transition: transform .15s; }
  .ghead[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .ghead .bar { grid-column: 2 / -1; }
  /* Stats (Checklist tab): a chart button at the right end of each team and player group header flips that group's card over to show
     the shared stats panel (lib/stats.js) where its cards were. While a card is flipped the rest of the list is dimmed
     and inert, and the flipped group can't be collapsed; the chart button, Back to cards, Escape or a click on the
     dimmed list flips it back. The header's tint runs under the button too. */
  .ghwrap { display: flex; align-items: stretch; }
  .ghwrap .ghead { flex: 1; min-width: 0; }
  .gstats { flex: none; width: 46px; border: 0; border-left: 1px solid rgba(20, 33, 46, .1); background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .gstats .ico { width: 18px; height: 18px; }
  .gstats:hover { color: var(--ink); background: rgba(255, 255, 255, .45); }
  .gstats[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, .6); }
  #list .group { transition: opacity .2s, filter .2s, box-shadow .2s; scroll-margin-top: var(--stick-h, 0px); }
  #list.focus { cursor: pointer; }
  #list.focus .group:not(.flipped) { opacity: .35; filter: saturate(.5); pointer-events: none; }
  #list.focus .group.flipped { cursor: auto; box-shadow: 0 10px 28px rgba(20, 33, 46, .16); }
  .ghead:disabled { cursor: default; color: inherit; } .ghead:disabled .chev { visibility: hidden; }
  @keyframes flipOut { to { transform: perspective(1400px) rotateY(90deg); } }
  @keyframes flipIn { from { transform: perspective(1400px) rotateY(-90deg); } }
  .group.flip-out { animation: flipOut .17s ease-in forwards; }
  .group.flip-in { animation: flipIn .22s ease-out; }

  .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: var(--radius-s); font-size: 14px; max-width: 92vw; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { *, .chev { transition: none !important; } }

  /* Icons, tags and controls: one icon set (.ico), 6px tags, pill-shaped controls. */
  .ico { width: 12px; height: 12px; display: block; flex: none; }
  .chev { display: inline-grid; place-items: center; color: var(--muted); }
  .chev .ico { width: 12px; height: 12px; }
  .group { border-radius: 12px; }
  .badge, .par { border-radius: 6px; }
  .par { padding: 3px 9px; }
  .par b { font-weight: 600; }
  .par.one .ico { width: 11px; height: 11px; }
  .num { font-family: var(--body); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .num i { font-style: normal; opacity: .5; margin-right: 1px; }
  .chip span { background: none; width: 14px; height: 14px; }
  .chip span .ico { width: 12px; height: 12px; }
  .fbtn { gap: 7px; } .fbtn > .ico { width: 15px; height: 15px; }
  #activebar #clear { margin-left: 2px; }
  .btn.ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 500; font-size: 14px; }
  .btn.ghost .ico { width: 15px; height: 15px; }
  .btn.ghost:hover { background: var(--surface); color: var(--ink); border-color: var(--ink); }

  /* My teams: the visitor's own teams, kept in this browser. The button shows a dot while they're in effect. */
  /* Customize: a button in the corner opposite the set title opens a side drawer (a bottom sheet on phones).
     My teams is its first section. A green dot on the button shows while custom teams change the view. */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .topbar .sethead { min-width: 0; }
  .custbtn { flex: none; margin: 14px 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 12px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .custbtn .ico { width: 16px; height: 16px; }
  .custbtn:hover, .custbtn[aria-expanded="true"] { border-color: var(--ink); }
  .custbtn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .cdot { width: 7px; height: 7px; border-radius: 50%; background: #3DDC97; }
  .dscrim { position: fixed; inset: 0; z-index: 30; background: rgba(20, 33, 46, .28); }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 31; width: min(420px, 100vw); box-sizing: border-box; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(20, 33, 46, .14); display: flex; flex-direction: column; }
  .dgrab { display: none; }
  .dhead { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .dhead h2 { margin: 0; font-family: var(--cond); font-weight: 700; font-size: 24px; }
  .dclose { width: 36px; height: 36px; border: 0; border-radius: 8px; background: #F1F4F7; display: grid; place-items: center; cursor: pointer; }
  .dclose .done { display: none; }
  .dbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 20px 24px; }
  @media (max-width: 600px) {
    .custbtn { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 12px; position: relative; margin-top: 12px; }
    .custbtn .lab { display: none; } .custbtn .cdot { position: absolute; top: 7px; right: 7px; }
    .drawer { top: auto; left: 0; width: auto; max-height: 85vh; border-left: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 24px rgba(20, 33, 46, .18); }
    .dgrab { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
    .dhead { border-bottom: 0; padding: 8px 16px 4px; } .dbody { padding: 4px 16px 20px; }
    .dclose { width: auto; padding: 8px 16px; border-radius: 999px; font-weight: 600; } .dclose .ico { display: none; } .dclose .done { display: inline; }
  }
  .cthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
  .ctsec { display: inline-flex; align-items: center; gap: 10px; }
  .ctsec h3 { margin: 0; font-family: var(--cond); font-weight: 700; font-size: 20px; }
  .ctsw { flex: none; width: 26px; height: 26px; border-radius: 6px; }
  .ctopen { flex: 1; min-width: 0; border: 0; background: none; padding: 2px 0; text-align: left; cursor: pointer; }
  .ctopen strong { display: block; font-family: var(--cond); font-weight: 700; font-size: 19px; line-height: 1.2; }

  .switch.sm input { width: 28px; height: 16px; } .switch.sm input::after { width: 12px; height: 12px; } .switch.sm input:checked::after { transform: translateX(12px); }
  .ctrow { display: flex; align-items: center; gap: 8px; }

  .ctname:hover, .ctname:focus { border-color: var(--line); background: var(--surface); }

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5E7E"/><stop offset=".25" stop-color="#FFB547"/><stop offset=".5" stop-color="#5EE6A8"/><stop offset=".75" stop-color="#5AB8FF"/><stop offset="1" stop-color="#B07CFF"/></linearGradient></defs></svg>
<div class="wrap">
  <div class="topbar">

</div>

  <div class="dbody ctpanel" id="ctpanel"></div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const TYPES = ['Base', 'Insert', 'SSP', 'Autograph', 'Memorabilia'];
  const GROUPINGS = [['subset', 'Subset'], ['team', 'Team'], ['player', 'Player']];
  const ICON = {
    chev: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.6 3.6l4.8 4.8m0-4.8-4.8 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    check: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6.3 4.9 8.7 9.7 3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.2" y="5.2" width="7.6" height="5.4" rx="1.2" fill="currentColor"/><path d="M3.9 5.2V3.9a2.1 2.1 0 0 1 4.2 0v1.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
    caret: '<svg class="ico" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.6 6 7.6l3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cl:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('cl:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- data source ----------
  const demo = window.DEMO_DATA || null;
  const inGrist = !demo && window.grist && window.self !== window.top;
  const source = {
    async fetch(t) { return demo ? demo[t] : grist.docApi.fetchTable(t); },
    async act(actions) { if (demo) { applyDemo(actions); return; } return grist.docApi.applyUserActions(actions); },
  };
  let demoNextId = 100000;
  function applyDemo(actions) {
    const P = demo.Pulls;
    for (const a of actions) {
      if (a[0] === 'AddRecord') { P.id.push(demoNextId++); P.Card_Key.push(a[3].Card_Key); P.Parallel_Key.push(a[3].Parallel_Key); (P.Off_Market ||= []).push(!!a[3].Off_Market); (P.Reported_At ||= []).push(Date.now() / 1000); }
      if (a[0] === 'RemoveRecord') { const i = P.id.indexOf(a[2]); if (i >= 0) for (const k in P) P[k].splice(i, 1); }
      if (a[0] === 'UpdateRecord') { const i = P.id.indexOf(a[2]); if (i >= 0) for (const k in a[3]) (P[k] ||= [])[i] = a[3][k]; }
    }
  }
  const refs = (v) => Array.isArray(v) ? (v[0] === 'L' ? v.slice(1) : v) : (typeof v === 'string' && v.startsWith('[') ? JSON.parse(v) : []);
  const rows = (cols) => cols.id.map((id, i) => { const o = { id }; for (const k in cols) o[k] = cols[k][i]; return o; });

  // ---------- state ----------
  // Filter groups are Sets; empty = no limit. Pills in a row are OR; rows are AND.
  const D = {};
  const S = {
    tab: store.get('tab', 'checklist'), q: '',
    f: { type: new Set(), team: new Set(), subset: new Set(), product: new Set(), status: new Set() },
    players: new Set(),
    panelOpen: false,                               // filters panel
    ctOpen: false, ctShare: false, ctConfirm: null, ctFocus: null, // Customize drawer (My teams)
    ctExp: new Map(),                               // team id -> expanded in the drawer (default: only teams with no players)
    sug: [], sugIdx: -1,                            // player suggestions under the search box
    groupBy: store.get('groupBy', { checklist: 'team', ones: 'team' }),
    taps: { checklist: new Map(), ones: new Map() }, // groups the visitor opened/closed, per view
    cardsOpen: new Set(),
    flip: null,                                     // key of the group flipped to its stats ('t…' team, 'p…' player), one at a time
  };
  if (!['checklist', 'ones'].includes(S.tab)) S.tab = 'checklist';

  async function loadAll() {
    const [sub, prod, cards, pars, exc, pulls, plyr] = await Promise.all(
      ['Subsets', 'Products', 'Cards', 'Parallels', 'PrintRunExceptions', 'Pulls', 'Players'].map((t) => source.fetch(t)));
    // Teams is optional: a doc without it (or a team without a Tint) just shows no team shading.
    D.baseTint = new Map();
    try { for (const t of rows(await source.fetch('Teams'))) if (t.Team && t.Tint) D.baseTint.set(String(t.Team).trim(), String(t.Tint).trim()); } catch (e) {}
    // Cards.Players is a reference list to Players; names live in Players.Player_Name.
    const playerName = new Map(rows(plyr).map((p) => [p.id, String(p.Player_Name ?? '').trim()]));
    D.subsets = rows(sub); D.products = rows(prod); D.cards = rows(cards); D.parallels = rows(pars); D.exc = rows(exc);
    D.subsetById = new Map(D.subsets.map((s) => [s.id, s]));
    D.parById = new Map(D.parallels.map((p) => { p.products = new Set(refs(p.ParallelProducts_Product)); return [p.id, p]; }));
    D.parsBySubset = new Map();
    for (const p of D.parallels) { if (!D.parsBySubset.has(p.Subset)) D.parsBySubset.set(p.Subset, []); D.parsBySubset.get(p.Subset).push(p); }
    D.excByKey = new Map(D.exc.map((e) => [e.Card_Key + ':' + e.Parallel_Key, e]));
    D.subsetProducts = new Map();
    for (const [sid, ps] of D.parsBySubset) { const set = new Set(); ps.forEach((p) => p.products.forEach((x) => set.add(x))); D.subsetProducts.set(sid, set); }
    for (const c of D.cards) {
      c.sub = D.subsetById.get(c.Subset) || { Subset: '' };
      c.ones = refs(c.One_of_Ones).map((pid) => D.parById.get(pid)).filter(Boolean);
      c.excs = refs(c.Print_Run_Exceptions);
      // Card_Name is the display name; if it's blank, fall back to the card's player names.
      c.playerNames = refs(c.Players).map((id) => playerName.get(id)).filter(Boolean);
      c.name = (typeof c.Card_Name === 'string' && c.Card_Name.trim()) || c.playerNames.join(' / ') || '(No player)';
      // A card can list several teams ("A / B"); each one is a team in its own right for grouping and filters.
      // baseTeam(s) is what the doc says; c.Team and c.teams are what the views use, after custom teams (see below).
      c.baseTeam = String(c.Team || '');
      c.baseTeams = [...new Set(c.baseTeam.split(' / ').map((t) => t.trim()).filter(Boolean))];
    }
    D.cards.sort((a, b) => (a.Subset - b.Subset) || (a.Card_Number - b.Card_Number));
    D.totalOnes = D.cards.reduce((n, c) => n + c.ones.length, 0);
    D.players = [...new Set(D.cards.flatMap((c) => c.playerNames))].sort();
    D.baseTeamNames = new Set(D.cards.flatMap((c) => c.baseTeams));
    // A player's own team, from her single-team cards; used to place each player on a shared card.
    D.basePlayerTeam = new Map();
    for (const c of D.cards) for (const n of c.playerNames) if (!D.basePlayerTeam.has(n) && c.baseTeams.length === 1) D.basePlayerTeam.set(n, c.baseTeams[0]);
    applyCustomTeams();
    setPulls(pulls);
    if (window.SetStats) SetStats.injectStyles();
    bind();
    render();
  }
  // Off_Market and Reported_At were added to Pulls later; docs without them just don't offer Off market or dates.
  function setPulls(pulls) {
    D.hasOffMarket = 'Off_Market' in pulls;
    D.hasReported = 'Reported_At' in pulls;
    D.pulls = new Map(); for (const p of rows(pulls)) D.pulls.set(p.Card_Key + ':' + p.Parallel_Key, p);
    D.statsVersion = (D.statsVersion || 0) + 1;
  }
  async function reloadPulls() { setPulls(await source.fetch('Pulls')); render(); }
  const pullOf = (c, p) => D.pulls.get(c.id + ':' + p.id);

  // ---------- custom teams ----------
  // A visitor's own teams, kept only in this browser (localStorage "cl:customTeams"), never in the doc. Every set's
  // widget loads from the same site, so the teams follow the visitor across checklists. Players are matched by name
  // (case and accents ignored), and each player is on at most one custom team.
  // Custom teams override the doc: a claimed player's cards leave her real team for the custom one. On a shared card,
  // each player brings her own team, so a card with one claimed player lists the custom team and the other player's
  // team (shown under both, blended tile, half credit), and a card whose players are all claimed belongs only to the
  // custom team. The views read c.Team / c.teams, so grouping, filters, shading, search and CSV all follow.
  const CT_KEY = 'customTeams';
  const CT_COLORS = ['#7048E8', '#D6336C', '#1C7ED6', '#F08C00', '#2B8A3E', '#0C8599'];
  const norm = (s) => String(s ?? '').normalize('NFKD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
  function loadCT() {
    const raw = store.get(CT_KEY, null) || {};
    const teams = (Array.isArray(raw.teams) ? raw.teams : []).map((t, i) => ({
      id: String(t && t.id || 'ct' + Date.now().toString(36) + i),
      name: String(t && t.name || '').trim(),
      color: /^#[0-9a-f]{6}$/i.test(t && t.color) ? t.color : CT_COLORS[i % CT_COLORS.length],
      players: [...new Set((Array.isArray(t && t.players) ? t.players : []).map((p) => String(p).trim()).filter(Boolean))],
      on: !(t && t.on === false),
    })).filter((t) => t.name);
    return { on: raw.on !== false, teams };
  }
  let CT = loadCT();
  const saveCT = () => store.set(CT_KEY, CT);

  // Same tint as the Teams table's Tint formula: keep the hue, pale it (lightness .89, saturation clamped to .45–.75),
  // neutral gray for colors with no usable hue, and lighten until text keeps 7:1 contrast with the ink #14212E.
  function tintOf(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return null;
    const [r, g, b] = [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), L = (mx + mn) / 2;
    let H = 0, S = 0;
    if (mx !== mn) {
      const d = mx - mn;
      S = L <= 0.5 ? d / (mx + mn) : d / (2 - mx - mn);
      const rc = (mx - r) / d, gc = (mx - g) / d, bc = (mx - b) / d;
      H = (r === mx ? bc - gc : g === mx ? 2 + rc - bc : 4 + gc - rc) / 6;
      H = ((H % 1) + 1) % 1;
    }
    let S2, L2;
    if (S < 0.12 || mx - mn < 0.08) { S2 = 0; L2 = 0.88; } else { S2 = Math.min(Math.max(S, 0.45), 0.75); L2 = 0.89; }
    const v = (m1, m2, h) => { h = ((h % 1) + 1) % 1; return h < 1 / 6 ? m1 + (m2 - m1) * h * 6 : h < 0.5 ? m2 : h < 2 / 3 ? m1 + (m2 - m1) * (2 / 3 - h) * 6 : m1; };
    const hls = (h, l, s) => { if (!s) return [l, l, l]; const m2 = l <= 0.5 ? l * (1 + s) : l + s - l * s, m1 = 2 * l - m2; return [v(m1, m2, h + 1 / 3), v(m1, m2, h), v(m1, m2, h - 1 / 3)]; };
    const lum = (rgb) => { const c = rgb.map((x) => x / 255).map((x) => x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
    const ink = lum([0x14, 0x21, 0x2E]);
    let rgb;
    for (;;) {
      // Python's round() rounds halves to even; match it so tints agree with the doc's to the digit.
      rgb = hls(H, L2, S2).map((x) => { const y = x * 255, f = Math.floor(y); return y - f === 0.5 ? (f % 2 ? f + 1 : f) : Math.round(y); });
      if ((lum(rgb) + 0.05) / (ink + 0.05) >= 7 || L2 >= 0.97) break;
      L2 += 0.01;
    }
    return '#' + rgb.map((x) => x.toString(16).padStart(2, '0').toUpperCase()).join('');
  }
  window.__tintOf = tintOf; // for the tests

  function applyCustomTeams() {
    D.statsVersion = (D.statsVersion || 0) + 1;
    const claims = new Map();
    // The switch at the top turns every custom team off; each team also has its own switch.
    const live = CT.on ? CT.teams.filter((t) => t.on) : [];
    for (const t of live) for (const p of t.players) claims.set(norm(p), t.name);
    D.teamTint = new Map(D.baseTint);
    for (const t of live) { const x = tintOf(t.color); if (x) D.teamTint.set(t.name, x); }
    D.customNames = new Set();
    // Which of a shared card's teams an unclaimed player brings: her own team when it's on the card, else the team in
    // her position (when there's one team per player), else all of the card's teams.
    const ownTeams = (c, n, i) => {
      if (c.baseTeams.length <= 1) return c.baseTeams;
      const known = D.basePlayerTeam.get(n);
      if (known && c.baseTeams.includes(known)) return [known];
      return c.baseTeams.length === c.playerNames.length ? [c.baseTeams[i]] : c.baseTeams;
    };
    for (const c of D.cards) {
      const claimed = c.playerNames.map((n) => claims.get(norm(n)));
      if (!claimed.some(Boolean)) { c.teams = c.baseTeams; c.Team = c.baseTeam; }
      else {
        c.teams = [...new Set(c.playerNames.flatMap((n, i) => claimed[i] ? [claimed[i]] : ownTeams(c, n, i)))];
        c.Team = c.teams.join(' / ');
        claimed.forEach((t) => t && D.customNames.add(t));
      }
      c.search = (c.name + ' ' + c.playerNames.join(' ') + ' ' + c.Team).toLowerCase();
    }
    D.teams = [...new Set(D.cards.flatMap((c) => c.teams))].sort((a, b) => (D.customNames.has(b) - D.customNames.has(a)) || a.localeCompare(b));
    D.playerTeam = new Map();
    for (const n of D.players) { const t = claims.get(norm(n)) || D.basePlayerTeam.get(n); if (t) D.playerTeam.set(n, t); }
    // A team filter on a team that no longer has cards (renamed, emptied, turned off) would hide everything.
    for (const t of [...S.f.team]) if (!D.teams.includes(t)) S.f.team.delete(t);
  }
  const ctActive = () => CT.on && D.customNames && D.customNames.size > 0;
  function ctChanged() { S.ctDirty = true; saveCT(); applyCustomTeams(); render(); }
  // Another widget (or another set's tab) changed the custom teams: pick them up.
  window.addEventListener('storage', (e) => { if (e.key === 'cl:' + CT_KEY && D.cards) { CT = loadCT(); applyCustomTeams(); render(); } });

  const nameTaken = (name, exceptId) => {
    const k = norm(name);
    return [...D.baseTeamNames].some((t) => norm(t) === k) || CT.teams.some((t) => t.id !== exceptId && norm(t.name) === k);
  };
  function newTeam() {
    let i = CT.teams.length + 1, name;
    do { name = 'My team' + (i > 1 ? ' ' + i : ''); i++; } while (nameTaken(name));
    const t = { id: 'ct' + Date.now().toString(36), name, color: CT_COLORS[CT.teams.length % CT_COLORS.length], players: [], on: true };
    CT.teams.push(t); CT.on = true;
    S.ctFocus = { id: t.id, field: 'name' };
    S.ctExp.set(t.id, true);
    ctChanged();
  }
  // Claim a player for a team; she leaves any other custom team (a player is on one custom team at most).
  // Any name can be added, so one team (e.g. "Personal Collection") can be built from a single checklist: a name that
  // matches a player in this set takes the set's spelling; any other is kept as typed, shown dimmed here, and claims
  // that player in whichever set has her under that name.
  function claimPlayer(teamId, input) {
    const t = CT.teams.find((x) => x.id === teamId); if (!t) return;
    const typed = String(input || '').replace(/\s+/g, ' ').trim().slice(0, 80);
    const k = norm(typed); if (!k) return;
    const match = D.players.find((p) => norm(p) === k);
    const name = match || typed;
    if (t.players.some((p) => norm(p) === k)) { toast(`${name} is already on ${t.name}`); return; }
    const from = CT.teams.find((x) => x !== t && x.players.some((p) => norm(p) === k));
    if (from) from.players = from.players.filter((p) => norm(p) !== k);
    t.players.push(name);
    S.ctFocus = { id: t.id, field: 'add' };
    ctChanged();
    toast((from ? `Moved ${name} from ${from.name} to ${t.name}` : `${name} added to ${t.name}`) + (match ? '' : ' (not in this set)'));
  }
  function renameTeam(teamId, value) {
    const t = CT.teams.find((x) => x.id === teamId); if (!t) return;
    const name = value.trim();
    if (!name || name === t.name) { renderCustomTeams(); return; }
    if (nameTaken(name, t.id)) { toast(`“${name}” is already a team name`); renderCustomTeams(); return; }
    for (const g of Object.values(S.taps)) if (g.has('t' + t.name)) { g.set('t' + name, g.get('t' + t.name)); g.delete('t' + t.name); }
    if (S.f.team.delete(t.name)) S.f.team.add(name);
    t.name = name;
    ctChanged();
  }

  // Share codes: the teams as base64 JSON ("CT1:…"), for backup and for passing a team to someone else.
  const exportCode = () => 'CT1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ teams: CT.teams.map((t) => ({ n: t.name, c: t.color, p: t.players, ...(t.on ? {} : { o: false }) })) }))));
  function importCode(code) {
    let data;
    try { data = JSON.parse(decodeURIComponent(escape(atob(String(code).trim().replace(/^CT1:/, ''))))); } catch (e) { toast('That code isn’t a custom teams code'); return; }
    const incoming = (Array.isArray(data && data.teams) ? data.teams : []).filter((t) => t && String(t.n || '').trim());
    if (!incoming.length) { toast('That code has no teams in it'); return; }
    for (const x of incoming) {
      let name = String(x.n).trim();
      const players = [...new Set((Array.isArray(x.p) ? x.p : []).map((p) => String(p).trim()).filter(Boolean))];
      let t = CT.teams.find((y) => norm(y.name) === norm(name));
      if (!t) {
        if ([...D.baseTeamNames].some((b) => norm(b) === norm(name))) name += ' (custom)';
        t = { id: 'ct' + Date.now().toString(36) + CT.teams.length, name, color: CT_COLORS[CT.teams.length % CT_COLORS.length], players: [], on: true };
        CT.teams.push(t);
      }
      if (/^#[0-9a-f]{6}$/i.test(x.c)) t.color = x.c;
      t.players = players;
      t.on = x.o !== false;
      // The imported team wins any player it shares with another custom team.
      const ks = new Set(players.map(norm));
      for (const y of CT.teams) if (y !== t) y.players = y.players.filter((p) => !ks.has(norm(p)));
    }
    CT.on = true;
    S.ctShare = false;
    ctChanged();
    toast(`Imported ${incoming.length} team${incoming.length === 1 ? '' : 's'}`);
  }

  // ---------- filtering ----------
  function cardMatches(c) {
    const f = S.f;
    if (f.team.size && !c.teams.some((t) => f.team.has(t))) return false;
    if (f.subset.size && !f.subset.has(String(c.Subset))) return false;
    if (f.type.size && ![...f.type].some((t) => c.sub[t])) return false;
    if (f.product.size) { const sp = D.subsetProducts.get(c.Subset); if (!sp || ![...f.product].some((p) => sp.has(+p))) return false; }
    if (S.q && !c.search.includes(S.q)) return false;
    if (S.players.size && !c.playerNames.some((n) => S.players.has(n))) return false;
    return true;
  }
  const parInProduct = (p) => !S.f.product.size || [...S.f.product].some((x) => p.products.has(+x));
  // A 1/1 is live (no pull logged), pulled, or off market (pulled, and the owner says it isn't for sale).
  const slotState = (c, p) => { const pl = pullOf(c, p); return !pl ? 'live' : pl.Off_Market ? 'off' : 'pulled'; };
  const STATES = { live: ['Live', 'Still out there'], pulled: ['Pulled', 'Someone has it'], off: ['Off market', 'Pulled, and not for sale'] };
  const stateKeys = () => D.hasOffMarket ? ['live', 'pulled', 'off'] : ['live', 'pulled'];
  const statusOk = (c, p) => !S.f.status.size || S.f.status.has(slotState(c, p));
  // 1/1s of a card that pass product + status filters
  const visibleOnes = (c) => c.ones.filter((p) => parInProduct(p) && statusOk(c, p));
  const productOnes = (c) => c.ones.filter(parInProduct);

  function cardParallels(c) {
    return (D.parsBySubset.get(c.Subset) || []).filter(parInProduct).map((p) => {
      const e = D.excByKey.get(c.id + ':' + p.id);
      if (e) return { p, label: e.Label || p.Parallel, run: e.Not_Available ? null : e.Print_Run, na: !!e.Not_Available, exc: true };
      return { p, label: p.Parallel + (p.Print_Run ? ' /' + p.Print_Run : ''), run: p.Print_Run, na: false, exc: false };
    });
  }

  // ---------- grouping ----------
  // Each card yields [key, name] pairs; a card showing several players lands in each player's group.
  const groupsOf = {
    subset: (c) => [['s' + c.Subset, c.sub.Subset]],
    team: (c) => (c.teams.length ? c.teams : ['(No team)']).map((t) => ['t' + t, t]),
    player: (c) => (c.playerNames.length ? c.playerNames : ['(No player)']).map((n) => ['p' + n, n]),
  };
  const groupSort = { subset: (a, b) => a.first.Subset - b.first.Subset, team: (a, b) => (D.customNames.has(b.name) - D.customNames.has(a.name)) || a.name.localeCompare(b.name), player: (a, b) => a.name.localeCompare(b.name) };
  function groupCards(cards) {
    const by = S.groupBy[S.tab];
    const m = new Map();
    // A shared card lands in every team's (or player's) group, but when teams are filtered or players pinned,
    // only the chosen teams' (or players') groups are shown.
    const keep = by === 'team' && S.f.team.size ? (name) => S.f.team.has(name)
      : by === 'player' && S.players.size ? (name) => S.players.has(name) : () => true;
    for (const c of cards) for (const [k, name] of groupsOf[by](c)) { if (!keep(name)) continue; if (!m.has(k)) m.set(k, { key: k, name, first: c, cards: [] }); m.get(k).cards.push(c); }
    const gs = [...m.values()].sort(groupSort[by]);
    for (const g of gs) g.cards.sort((a, b) => (a.Subset - b.Subset) || (a.Card_Number - b.Card_Number));
    return gs;
  }
  // Groups start closed and open or close only when the visitor clicks them (or Expand/Collapse all).
  // Filter changes never open or close a group.
  const taps = () => S.taps[S.tab];
  const isOpen = (g) => taps().get(g.key) === true;

  // ---------- controls ----------
  function filterGroups() {
    const g = [
      ['team', 'Team', D.teams.map((t) => [t, t])],
      ['type', 'Type', TYPES.map((t) => [t, t])],
      ['subset', 'Subset', D.subsets.map((s) => [String(s.id), s.Subset])],
      ['product', 'Product', D.products.map((p) => [String(p.id), p.Product])],
    ];
    if (S.tab === 'ones') g.push(['status', 'Status', stateKeys().map((k) => [k, STATES[k][0]])]);
    return g;
  }
  // Filters live in a panel behind the Filters button. Everything narrowing the list (filter pills and
  // pinned players) shows as removable chips next to that button.
  function renderFilters() {
    const groups = filterGroups();
    $('#filters').hidden = !S.panelOpen;
    $('#fbtn').setAttribute('aria-expanded', S.panelOpen);
    if (S.panelOpen) $('#filters').innerHTML = groups.map(([key, label, items]) =>
      `<div class="fgroup"><span class="flabel" id="fl-${key}">${label}</span><div class="pills" role="group" aria-labelledby="fl-${key}">` +
      items.map(([v, t]) => `<button class="toggle" data-f="${key}" data-v="${esc(v)}" aria-pressed="${S.f[key].has(v)}">${esc(t)}</button>`).join('') +
      `</div></div>`).join('');
    const chips = [];
    for (const [key, , items] of groups) for (const [v, t] of items) if (S.f[key].has(v)) chips.push(chip(`data-f="${key}" data-v="${esc(v)}"`, t));
    const nFilters = chips.length;
    for (const p of S.players) chips.push(chip(`data-player="${esc(p)}"`, p));
    $('#chips').innerHTML = chips.join('');
    $('#fcount').textContent = nFilters ? ' ' + nFilters : '';
    $('#clear').hidden = !(chips.length || S.q);
  }
  const chip = (attrs, label) => `<button class="chip" ${attrs} aria-label="Remove ${esc(label)}">${esc(label)}<span aria-hidden="true">${ICON.x}</span></button>`;
  function renderViewbar() {
    const by = S.groupBy[S.tab];
    $('#viewbar').innerHTML = `<span class="seglabel">Group by</span><span class="seg" role="group" aria-label="Group by">` +
      GROUPINGS.map(([v, t]) => `<button data-group="${v}" aria-pressed="${by === v}">${t}</button>`).join('') + `</span>`;
  }
  function bind() {
    document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; S.flip = null; store.set('tab', S.tab); render(); });
    $('#q').oninput = (e) => { S.q = e.target.value.trim().toLowerCase(); S.sugIdx = -1; render(); };
    $('#q').onkeydown = onSearchKey;
    $('#q').onfocus = () => renderSuggest();
    $('#fbtn').onclick = () => { S.panelOpen = !S.panelOpen; renderFilters(); };
    bindCustomTeams();
    const togglePill = (e) => {
      const b = e.target.closest('[data-f]'); if (!b) return false;
      const key = b.dataset.f, v = b.dataset.v, set = S.f[key], inPanel = !!b.closest('#filters');
      set.has(v) ? set.delete(v) : set.add(v);
      render();
      // The panel is redrawn on every change; keep keyboard focus on the same pill.
      if (inPanel) $(`#filters [data-f="${key}"][data-v="${CSS.escape(v)}"]`)?.focus();
      return true;
    };
    $('#filters').onclick = togglePill;
    $('#chips').onclick = (e) => {
      if (togglePill(e)) return;
      const b = e.target.closest('[data-player]'); if (b) { S.players.delete(b.dataset.player); render(); }
    };
    $('#suggest').onmousedown = (e) => e.preventDefault(); // keep focus in the search box
    $('#suggest').onclick = (e) => { const li = e.target.closest('[data-add]'); if (li) pinPlayer(li.dataset.add); };
    document.addEventListener('click', (e) => { if (!e.target.closest('.search')) hideSuggest(); });
    $('#viewbar').onclick = (e) => {
      const g = e.target.closest('[data-group]');
      if (g) { S.groupBy[S.tab] = g.dataset.group; S.flip = null; store.set('groupBy', S.groupBy); render(); }
    };
    $('#clear').onclick = () => { Object.values(S.f).forEach((s) => s.clear()); S.players.clear(); S.q = ''; $('#q').value = ''; render(); };
    $('#allgroups').onclick = () => {
      const open = $('#allgroups').dataset.action === 'expand';
      for (const k of S.groupKeys || []) taps().set(k, open);
      render();
    };
    $('#download').onclick = download;
    $('#list').addEventListener('click', onListClick);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.flip && !S.ctOpen && !menuEl) { e.preventDefault(); flipStats(null); } });
    document.querySelectorAll('.totop').forEach((b) => b.onclick = backToTop);
    let ticking = false;
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; updateScrollUi(); }); } };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    // Rows reached with Tab (or scrolled into view) stop below the sticky toolbar instead of behind it.
    // (A margin on the rows, not scroll-padding on the page: padding would also scroll when a toolbar control is focused.)
    if (window.ResizeObserver) new ResizeObserver(() => { document.documentElement.style.setProperty('--stick-h', $('#toolbar').offsetHeight + 8 + 'px'); }).observe($('#toolbar'));
  }

  // ---------- sticky toolbar and back to top ----------
  // The toolbar gets a shadow once it's stuck. The footer shows when the page is taller than the screen; the floating
  // button shows after about a screen of scrolling, until the footer comes into view.
  function updateScrollUi() {
    const y = window.scrollY, vh = window.innerHeight, foot = $('#foot');
    $('#toolbar').classList.toggle('stuck', y > 0 && $('#toolbar').getBoundingClientRect().top <= 0);
    foot.hidden = document.documentElement.scrollHeight - (foot.hidden ? 0 : foot.offsetHeight) <= vh + 4;
    const footInView = !foot.hidden && foot.getBoundingClientRect().top < vh;
    $('#fab').classList.toggle('show', y > vh * 0.75 && !footInView);
  }
  function backToTop(e) {
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
    // Keyboard users land at the top of the page too: focus moves to the selected tab.
    if (e && e.detail === 0) document.querySelector('.tab[aria-selected="true"]')?.focus({ preventScroll: true });
  }

  // ---------- Customize drawer: My teams ----------
  // The Customize button (top right, across from the set title) opens a side drawer, or a bottom sheet on phones.
  // My teams is its first section: a switch for the whole feature, then one card per custom team with its own switch,
  // color and name. A card opens to edit its players (removable chips, dimmed when they're not in this set, and a box
  // to claim another player from this set) or delete the team. Cards start closed, except a team with no players yet.
  // soft: called from a general render; leaves the drawer alone while the visitor is typing in it.
  const teamCards = (name) => D.cards.reduce((n, c) => n + (c.teams.includes(name) ? 1 : 0), 0);
  function teamMeta(t, inSet) {
    const n = t.players.length, here = t.players.filter((p) => inSet.has(norm(p))).length;
    const who = !n ? 'No players yet' : here === n ? `${n} player${n === 1 ? '' : 's'}` : `${here} of ${n} players in this set`;
    if (!CT.on || !t.on) return (t.on ? '' : 'Off · ') + who;
    const k = teamCards(t.name);
    return who + (k ? ` · ${k} card${k === 1 ? '' : 's'}` : '');
  }
  function renderCustomTeams(soft) {
    const btn = $('#custbtn'), drawer = $('#ctdrawer'), panel = $('#ctpanel');
    const active = ctActive();
    btn.classList.toggle('on', active);
    btn.querySelector('.cdot').hidden = !active;
    btn.setAttribute('aria-expanded', S.ctOpen);
    btn.setAttribute('aria-label', 'Customize' + (active ? ', custom teams on' : ''));
    drawer.hidden = $('#ctscrim').hidden = !S.ctOpen;
    if (!S.ctOpen) return;
    if (soft && !S.ctDirty && drawer.contains(document.activeElement) && panel.childElementCount) return;
    S.ctDirty = false;
    $('#ctplayers').innerHTML = D.players.map((p) => `<option value="${esc(p)}">`).join('');
    const inSet = new Set(D.players.map(norm));
    const teamsHtml = CT.teams.map((t) => {
      const open = S.ctExp.has(t.id) ? S.ctExp.get(t.id) : !t.players.length;
      const tint = tintOf(t.color) || '';
      const meta = esc(teamMeta(t, inSet));
      const chev = `<button class="ctchev" data-cttoggle aria-expanded="${open}" aria-label="${open ? 'Close' : 'Open'} ${esc(t.name)}">${ICON.chev}</button>`;
      const sw = `<label class="switch sm" title="${t.on ? 'On' : 'Off'}"><input type="checkbox" data-cton ${t.on ? 'checked' : ''} aria-label="Use ${esc(t.name)}"></label>`;
      if (!open) return `<div class="ctteam${t.on ? '' : ' off'}" data-ct="${esc(t.id)}"><div class="ctrow">${sw}
        <span class="ctsw" style="background:${esc(t.color)}" aria-hidden="true"></span>
        <button class="ctopen" data-cttoggle aria-expanded="false"><strong>${esc(t.name)}</strong><small>${meta}</small></button>${chev}</div></div>`;
      const chips = t.players.map((p) => { const away = !inSet.has(norm(p));
        return `<button class="chip ctp${away ? ' away' : ''}" style="--blk:${tint}" data-ctrm="${esc(p)}" aria-label="Remove ${esc(p)} from ${esc(t.name)}"${away ? ' title="Not in this set"' : ''}>${esc(p)}<span aria-hidden="true">${ICON.x}</span></button>`; }).join('');
      const confirming = S.ctConfirm === t.id;
      return `<div class="ctteam${t.on ? '' : ' off'}" data-ct="${esc(t.id)}">
        <div class="ctrow">${sw}<input type="color" value="${esc(t.color)}" data-ctcolor aria-label="Color for ${esc(t.name)}">
          <input class="ctname" value="${esc(t.name)}" data-ctname aria-label="Team name" maxlength="40">${chev}</div>
        ${chips ? `<div class="ctplayers">${chips}</div>` : ''}
        <div class="ctadd"><input list="ctplayers" placeholder="Add a player" aria-label="Add a player to ${esc(t.name)}" data-ctadd autocomplete="off"><button class="btn ghost" data-ctaddbtn>Add</button></div>
        <div class="ctmetarow"><span class="ctmeta">${meta}</span><span><button class="link ctdel${confirming ? ' confirm' : ''}" data-ctdel>${confirming ? 'Delete team?' : 'Delete team'}</button>${confirming ? '<button class="link" data-ctkeep>Keep</button>' : ''}</span></div>
      </div>`;
    }).join('');
    // Redrawing replaces the controls; keep keyboard focus on the same one (by id) when it had it.
    const keep = panel.contains(document.activeElement) ? document.activeElement.id : '';
    panel.classList.toggle('alloff', !CT.on);
    panel.innerHTML = `<div class="cthead"><span class="ctsec"><label class="switch"><input type="checkbox" id="cton" ${CT.on ? 'checked' : ''} aria-labelledby="ctsech"></label><h3 id="ctsech">My teams</h3></span>
        <button class="link" id="ctsharebtn" aria-expanded="${S.ctShare}">Share/import</button></div>
      <p class="cthint">Claim players for a team of your own. Their cards move to your team in every view and download.</p>
      ${S.ctShare ? `<div class="ctshare"><label class="flabel" for="ctcode">Your teams as a code</label><textarea id="ctcode" readonly>${esc(CT.teams.length ? exportCode() : '')}</textarea>
        <span class="row"><button class="btn ghost" id="ctcopy" ${CT.teams.length ? '' : 'disabled'}>Copy code</button></span>
        <label class="flabel" for="ctimport">Paste a code to add its teams</label><textarea id="ctimport" placeholder="CT1:…"></textarea>
        <span class="row"><button class="btn ghost" id="ctdoimport">Import</button></span></div>` : ''}
      ${teamsHtml}
      <div class="ctfoot"><button class="btn ghost ctnew" id="ctnew">+ New team</button></div>`;
    if (S.ctFocus) {
      const f = S.ctFocus; S.ctFocus = null;
      const el = panel.querySelector(`[data-ct="${CSS.escape(f.id)}"] [data-ct${f.field}]`);
      if (el) { el.focus(); if (f.field === 'name') el.select(); }
    } else if (keep) panel.querySelector('#' + CSS.escape(keep))?.focus();
    if (!drawer.contains(document.activeElement)) $('#ctclose').focus();
  }
  function openDrawer() {
    S.ctOpen = true; S.ctConfirm = null; S.ctDirty = true;
    renderCustomTeams();
    document.documentElement.style.overflow = 'hidden';
    $('#ctclose').focus();
  }
  function closeDrawer() {
    if (!S.ctOpen) return;
    S.ctOpen = false; S.ctConfirm = null;
    renderCustomTeams();
    document.documentElement.style.overflow = '';
    $('#custbtn').focus();
  }
  function bindCustomTeams() {
    const panel = $('#ctpanel'), drawer = $('#ctdrawer');
    $('#custbtn').onclick = () => S.ctOpen ? closeDrawer() : openDrawer();
    $('#ctclose').onclick = closeDrawer;
    $('#ctscrim').onclick = closeDrawer;
    // Escape closes; Tab stays inside the drawer while it's open.
    document.addEventListener('keydown', (e) => { if (S.ctOpen && e.key === 'Escape') { e.preventDefault(); closeDrawer(); } });
    drawer.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = [...drawer.querySelectorAll('button, input, textarea, a[href]')].filter((n) => !n.disabled && n.offsetParent !== null);
      if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    });

    const teamOf = (el) => el.closest('[data-ct]')?.dataset.ct;
    panel.addEventListener('click', (e) => {
      const t = e.target;
      if (t.closest('#ctnew')) return newTeam();
      if (t.closest('#ctsharebtn')) { S.ctShare = !S.ctShare; return renderCustomTeams(); }
      if (t.closest('#ctdoimport')) return importCode($('#ctimport').value);
      if (t.closest('#ctcopy')) {
        const code = $('#ctcode'); code.select();
        const done = () => toast('Code copied');
        (navigator.clipboard ? navigator.clipboard.writeText(code.value) : Promise.reject()).then(done, () => { try { document.execCommand('copy') ? done() : toast('Select the code and copy it'); } catch (err) { toast('Select the code and copy it'); } });
        return;
      }
      const id = teamOf(t); if (!id) return;
      const team = CT.teams.find((x) => x.id === id); if (!team) return;
      const tg = t.closest('[data-cttoggle]');
      if (tg) { const open = tg.getAttribute('aria-expanded') !== 'true'; S.ctExp.set(id, open); S.ctConfirm = null; S.ctFocus = { id, field: 'toggle' }; return renderCustomTeams(); }
      const rm = t.closest('[data-ctrm]');
      if (rm) { team.players = team.players.filter((p) => p !== rm.dataset.ctrm); S.ctFocus = { id, field: 'add' }; return ctChanged(); }
      if (t.closest('[data-ctaddbtn]')) return claimPlayer(id, t.closest('[data-ct]').querySelector('[data-ctadd]').value);
      if (t.closest('[data-ctkeep]')) { S.ctConfirm = null; return renderCustomTeams(); }
      if (t.closest('[data-ctdel]')) {

  // ---------- menus ----------

  const FEATURED_MAX = 3;
  // Sets are listed by their `order` number: lowest first in each year, highest first in Featured (which also keeps the
  // three highest). Sets without a number always come after numbered ones, in file order.
  const byOrder = (list, desc = false) => list.map((x, i) => [x, i]).sort(([a, i], [b, j]) => {
    const na = Number.isFinite(a.order), nb = Number.isFinite(b.order);
    if (na !== nb) return na ? -1 : 1;
    return (na ? (desc ? b.order - a.order : a.order - b.order) : 0) || i - j;
  }).map(([x]) => x);
  const SETS = { sections: [], all: [], current: null, docName: '' };
  async function loadSets() {
    let data = null, docId = '', docName = '';
    try {
      if (demo) data = window.DEMO_SETS || null;
      else { const r = await fetch(new URL('../../sets.json', location.href)); if (r.ok) data = await r.json(); }
    } catch (e) {}
    if (demo) { docId = window.DEMO_DOC_ID || ''; docName = window.DEMO_DOC_NAME || ''; }
    else if (inGrist) {
      // getDocName() returns the doc's ID rather than its title, so the title comes from the REST API (GET /api/docs/:id)
      // using the widget's read-only access token. If that fails the title is a generic "Checklists", never the ID.
      try {
        const t = await grist.docApi.getAccessToken({ readOnly: true });
        docId = (/\/docs\/([^/?#]+)/.exec(t.baseUrl || '') || [])[1] || '';
        const r = await fetch(`${t.baseUrl}?auth=${encodeURIComponent(t.token)}`);
        if (r.ok) { const n = String((await r.json()).name || '').trim(); if (n && n !== docId) docName = n; }
      } catch (e) {}
      if (!docId) try { docId = await grist.docApi.getDocName(); } catch (e) {}
    }
    const years = (data && Array.isArray(data.years) ? data.years : [])
      .map((y) => ({ key: 'y:' + y.year, title: String(y.year ?? ''), sets: byOrder((y.sets || []).filter((x) => x && x.name)) }))
      .filter((y) => y.title && y.sets.length);
    SETS.all = years.flatMap((y) => y.sets);
    const featured = byOrder(SETS.all.filter((x) => x.featured === true), true).slice(0, FEATURED_MAX);
    SETS.sections = (featured.length ? [{ key: 'featured', title: 'Featured', sets: featured }] : []).concat(years);
    SETS.current = SETS.all.find((x) => docId && x.doc === docId) || null;
    SETS.docName = docName;
    renderSetHead();
  }
  function renderSetHead() {
    const head = $('#sethead');
    const all = SETS.all, cur = SETS.current;
    const title = cur ? cur.name : SETS.docName || (all.length ? 'Checklists' : '');
    if (!title && !all.length) { head.hidden = true; return; }
    const others = all.filter((x) => x !== cur).length;
    const sub = cur ? cur.sub || '' : '';
    head.hidden = false;
    head.innerHTML = (others
      ? `<button class="setbtn" id="setbtn" aria-haspopup="menu" aria-expanded="false" aria-label="${esc(title || 'Checklists')}. Switch checklist">${esc(title || 'Checklists')}<span class="car">${ICON.caret}</span></button>`
      : `<h1 class="setbtn">${esc(title)}</h1>`) + (sub ? `<div class="setsub">${esc(sub)}</div>` : '');
    if (others) $('#setbtn').onclick = (e) => openSetMenu(e.currentTarget);
  }
  // Each section is a header button and its sets. Featured starts open, years start closed; opening one section closes
  // the others, and clicking the open one closes it.
  function openSetMenu(btn) {
    const cur = SETS.current, start = SETS.sections[0] && SETS.sections[0].key === 'featured' ? 'featured' : '';
    // A set without a url (e.g. "Coming Soon...") is listed but dimmed and can't be opened; it can still take focus so
    // screen readers announce it as unavailable.
    const setText = (x) => `<span><b>${esc(x.name)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span>`;
    const setLink = (x) => !x.url
      ? `<div class="mi si soon" role="menuitem" aria-disabled="true" tabindex="-1">${setText(x)}</div>`
      : `<a class="mi si" role="menuitem" href="${esc(x.url)}" target="_top"${x === cur ? ' aria-current="page"' : ''}>${setText(x)}${x === cur ? `<span class="mic">${ICON.check}</span>` : ''}</a>`;
    const items = SETS.sections.map((g, i) => {
      const open = g.key === start, id = `msec-${i}`;
      return `<button class="mi msec" data-sec="${esc(g.key)}" aria-expanded="${open}" aria-controls="${id}"><b>${esc(g.title)}<small>${g.sets.length} checklist${g.sets.length === 1 ? '' : 's'}</small></b><span class="chev" aria-hidden="true">${ICON.chev}</span></button>` +
        `<div class="msub" id="${id}" role="group" aria-label="${esc(g.title)}"${open ? '' : ' hidden'}>${g.sets.map(setLink).join('')}</div>`;
    }).join('');
    const box = openMenu(btn, { label: 'Checklists', items, align: 'left', cls: 'setmenu', under: $('#sethead') });
    if (!box) return;
    box.onclick = (e) => {
      const sec = e.target.closest('.msec');
      if (sec) {
        const opening = sec.getAttribute('aria-expanded') !== 'true';
        box.querySelectorAll('.msec').forEach((b) => { const on = opening && b === sec; b.setAttribute('aria-expanded', on); box.querySelector('#' + b.getAttribute('aria-controls')).hidden = !on; });
        placeMenu();
        return;
      }
      // Picking the current set just closes the menu.
      const a = e.target.closest('a.mi'); if (a && a.hasAttribute('aria-current')) { e.preventDefault(); closeMenu(true); }
    };
  }

  // Live removes the logged pull; Pulled and Off market log one (or flip Off_Market on the one already logged).
  async function setStatus(key, next) {
    const [cardId, parId] = key.split(':').map(Number);
    const existing = D.pulls.get(key);
    const cur = !existing ? 'live' : existing.Off_Market ? 'off' : 'pulled';
    if (next === cur) return;
    if (existing && existing.id < 0) { toast('Still saving the last change. Try again in a moment.'); return; }
    let action;
    if (next === 'live') { D.pulls.delete(key); action = ['RemoveRecord', 'Pulls', existing.id]; }
    else if (existing) { existing.Off_Market = next === 'off'; action = ['UpdateRecord', 'Pulls', existing.id, { Off_Market: next === 'off' }]; }
    else {
      const rec = { Card_Key: cardId, Parallel_Key: parId }; if (next === 'off') rec.Off_Market = true;
      D.pulls.set(key, { id: -1, ...rec, Off_Market: next === 'off' }); action = ['AddRecord', 'Pulls', null, rec];
    }
    render();
    try { await source.act([action]); toast(`Marked ${STATES[next][0].toLowerCase()}`); }
    catch (err) { toast(writeError(err)); }
    reloadPulls();
  }
  function writeError(err) {
    const m = String(err && err.message || err);
    return /access|permission|denied|blocked/i.test(m) ? 'Not saved. Checking off 1/1s needs the edit link.' : 'Not saved: ' + m;
  }

  // ---------- CSV ----------
  function download() {
    const cur = S.current || { kind: 'cards', items: [] };
    let head, body;
    if (cur.kind === 'slots') {
      head = ['Team', 'Card Name', 'Players', 'Subset', 'Card Number', 'Parallel', 'Pulled'];
      if (D.hasOffMarket) head.push('Off Market');
      if (D.hasReported) head.push('Reported');
      body = cur.items.map(({ c, p }) => {
        const pl = pullOf(c, p);
        const r = [c.Team, c.name, c.playerNames.join('; '), c.sub.Subset, c.Card_Number, p.Parallel, pl ? 'Yes' : 'No'];
        if (D.hasOffMarket) r.push(pl ? (pl.Off_Market ? 'Yes' : 'No') : '');
        if (D.hasReported) r.push(pl && pl.Reported_At ? isoDate(pl.Reported_At) : '');
        return r;
      });
    } else {
      head = ['Subset', 'Card Number', 'Card Name', 'Players', 'Team', 'Position', 'Types', 'Parallels', '1/1s'];
      body = cur.items.map((c) => [c.sub.Subset, c.Card_Number, c.name, c.playerNames.join('; '), c.Team, c.Position || '', TYPES.filter((t) => c.sub[t]).join('; '),
        cardParallels(c).map((x) => x.label).join('; '), c.ones.map((p) => p.Parallel).join('; ')]);
    }
    const csv = [head].concat(body).map((r) => r.map(csvCell).join(',')).join('\r\n');
    const name = (cur.kind === 'slots' ? 'one-of-ones' : 'checklist') + '.csv';
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      toast(`Downloaded ${body.length} rows`);
    } catch (e) {
      navigator.clipboard?.writeText(csv).then(() => toast('Download blocked here. Copied the CSV to your clipboard instead.'));
    }
  }
  function csvCell(v) {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // ---------- utils ----------
  // Grist DateTime values are seconds since the epoch.
  const isoDate = (sec) => new Date(sec * 1000).toLocaleDateString('en-CA');
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
  let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

  // ---------- boot ----------
  if (inGrist) {
    grist.ready({ requiredAccess: 'full' });
    let booted = false;
    grist.onRecords(() => { if (booted) reloadPulls(); });
    loadAll().then(() => { booted = true; }).catch((e) => empty('Could not read the document: ' + (e.message || e) + '. Give this widget full document access in its settings.'));
    loadSets();
  } else if (demo) {
    loadAll(); loadSets();
  } else {
    empty('This page is a Grist custom widget. Add it to a Grist page as a custom widget to use it.');
  }
})();
</script>
</body>
</html>
